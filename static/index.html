<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e·closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEEDEA; --card:#FFFFFF; --tile:#F5F4F1; --tile-hi:#E7E5E0;
  --ink:#1B1B1A; --soft:#86847F; --faint:#B9B6B0; --line:#DEDAD3;
  --accent:#C9895B; --wood:#8A5A3B; --wood-hi:#A8714C; --danger:#B4473A;
  --r-lg:20px; --r:14px; --r-sm:10px;
  --serif:"Fraunces","Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font:400 14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:var(--bg) radial-gradient(circle,rgba(0,0,0,.045) 1.6px,transparent 2px) 0 0/34px 34px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.muted{color:var(--soft);font-size:12.5px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:20px;padding:16px 32px 0}
.brand{font:600 24px/1 var(--serif);letter-spacing:-.01em;margin-right:auto}
.brand i{font-style:normal;color:var(--accent)}
.link{border:0;background:none;padding:6px 2px;font-size:13px;color:var(--soft)}
.link:hover{color:var(--ink)}
.demo{font-size:12px;color:var(--soft);display:inline-flex;align-items:center;gap:7px}
.demo::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}

.room{display:grid;grid-template-columns:minmax(0,2.5fr) minmax(280px,.85fr);gap:28px;padding:6px 32px 28px;align-items:stretch}
.closet{min-width:0;display:flex;flex-direction:column;gap:14px}

/* ---------- 衣杆 ---------- */
.rack{position:relative;padding-top:30px}
.rod{position:absolute;left:18px;right:18px;top:36px;height:9px;border-radius:5px;z-index:0;
  background:linear-gradient(#fbfbfb 0%,#d6d6d6 30%,#9b9b9b 55%,#c9c9c9 80%,#efefef 100%);box-shadow:0 3px 5px rgba(0,0,0,.14)}
.rod::before,.rod::after{content:"";position:absolute;top:-9px;width:16px;height:27px;border-radius:4px;
  background:linear-gradient(90deg,#d9d9d9,#f6f6f6 45%,#b9b9b9);box-shadow:0 2px 4px rgba(0,0,0,.18)}
.rod::before{left:-8px}.rod::after{right:-8px}
.rackadd{position:absolute;right:28px;top:2px;border:0;border-radius:999px;background:var(--card);padding:4px 13px;font-size:12px;color:var(--soft);box-shadow:0 1px 3px rgba(0,0,0,.06);z-index:2}
.rackadd:hover{background:var(--ink);color:#fff}
/* 衣服只在衣杆两端支架之间挂：挂得多就互相挤，不会滑出去 */
.rail{position:relative;display:flex;justify-content:center;align-items:flex-start;margin:0 46px;padding-bottom:16px;min-height:330px}
.hang{position:relative;flex:0 1 58px;min-width:9px;height:312px;transition:flex-basis .6s var(--ease),flex-shrink .6s}
.hang.pants{flex-basis:38px}
.hang.belt{flex-basis:26px}
.hang.belt .g .pick{top:34px;left:60px;right:60px;bottom:30px}
.hang.belt.front{flex:0 0 150px}
.hang.front{flex:0 0 232px}
.sw{position:absolute;inset:0;transform-origin:50% 10px}
.g{position:absolute;left:50%;top:0;width:200px;margin-left:-100px;height:296px;transform-origin:50% 10px;
  transform:perspective(900px) rotateY(74deg);transition:transform .75s cubic-bezier(.3,1.32,.5,1),filter .6s;filter:brightness(.9) saturate(.95);
  animation:sway var(--t,6s) ease-in-out var(--d,0s) infinite alternate}
@keyframes sway{from{rotate:-.7deg}to{rotate:.7deg}}
.hang.front .g{transform:perspective(900px) rotateY(0) scale(1.04);filter:none}
/* 衣架在衣服后面：只露出挂钩，肩膀把衣架两头盖住 */
.hook{position:absolute;left:50%;top:0;width:84px;margin-left:-42px;height:34px;z-index:0;pointer-events:none}
.hang.pants .hook{width:100px;margin-left:-50px;height:40px}
.ownhook .hook{width:28px;margin-left:-14px;height:50px;top:-8px;z-index:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.g .pick{position:absolute;left:0;right:0;top:15px;bottom:0;border:0;background:none;padding:0;display:block;z-index:1}
.g .pick img{width:100%;height:100%;object-fit:contain;object-position:50% 0;display:block;transform-origin:50% 0;
  filter:drop-shadow(0 14px 14px rgba(55,45,35,.16))}
.g .pick img.card{background:#fff;border-radius:6px;padding:8px;height:auto;max-height:100%}
.hang.pants .g .pick{top:27px}
.hang.pants .clips{position:absolute;left:50%;top:0;width:100px;margin-left:-50px;height:40px;z-index:2;pointer-events:none}
.hang.on .mark{position:absolute;left:50%;top:-1px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--accent);z-index:3}
.x{position:absolute;width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:13px;line-height:22px;padding:0;color:var(--soft);opacity:0;z-index:4}
.x:hover{color:var(--danger)}
.hang .tools{position:absolute;top:30px;right:14px;display:flex;gap:4px;z-index:4;opacity:0;transition:opacity .2s}
.hang .tools .x{position:static;opacity:1}
.hang .tools .t{border:0;border-radius:999px;background:rgba(255,255,255,.92);font-size:11.5px;padding:2px 9px;color:var(--ink)}
.hang .tools .t:hover{background:var(--ink);color:#fff}
.hang.front .tools{opacity:1}
.thing:hover .x,.look:hover .x,.x:focus-visible{opacity:1}
.caption{height:52px;margin-top:-4px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center}
.caption b{display:block;font:400 17px/24px var(--serif);font-style:italic;height:24px;white-space:nowrap}
.caption span{font-size:12px;line-height:20px;height:20px;color:var(--soft);white-space:nowrap}
.railempty{position:absolute;left:0;right:0;top:120px;text-align:center;color:var(--soft);pointer-events:none}

/* ---------- 鞋架 ---------- */
.shelfwrap{position:relative;padding:0 28px;border-radius:var(--r);transition:background .4s;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:end}
.shelfwrap .ledge{grid-column:1/-1}
.shelfwrap.flash{background:rgba(201,137,91,.12)}
.shelflabel{padding:0 0 10px 2px;font:400 13px/1 var(--serif);font-style:italic;color:var(--soft);white-space:nowrap}
.shelf{display:flex;gap:18px;align-items:flex-end;justify-content:safe center;overflow-x:auto;scrollbar-width:none;padding:38px 10px 6px;min-height:130px}
.shelf::-webkit-scrollbar{display:none}
.ledge{height:7px;border-radius:4px;background:linear-gradient(#f3f1ed,#d2ccc2);box-shadow:0 4px 8px rgba(0,0,0,.07)}
.thing{position:relative;flex:0 0 112px;min-height:92px;justify-content:flex-end;display:flex;flex-direction:column;align-items:center;transition:transform .35s var(--ease)}
.thing:hover,.thing.front{transform:translateY(-6px) scale(1.12)}
.thing .pick{border:0;background:none;padding:0;width:104px;height:78px;display:flex;align-items:flex-end;justify-content:center}
.thing .pick img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 6px 6px rgba(60,50,40,.14))}
.thing .pick img.card{background:#fff;border-radius:6px;padding:4px}
.thing.on::after{content:"";position:absolute;bottom:-11px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.thing .tools{position:absolute;top:-14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;opacity:0;transition:opacity .2s;white-space:nowrap}
.thing:hover .tools,.thing:focus-within .tools{opacity:1}
.thing .tools .x{position:static;opacity:1}
.thing .tools .t{border:0;border-radius:999px;background:rgba(255,255,255,.95);font-size:11.5px;padding:2px 9px;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.thing .tools .t:hover{background:var(--ink);color:#fff}
.thing.add button{width:72px;height:72px;border:1.5px dashed var(--faint);border-radius:var(--r);background:none;color:var(--soft);font-size:22px;font-weight:300}
.thing.add button:hover{border-color:var(--ink);color:var(--ink)}
.thing.add{transform:none!important}

/* ---------- 今天这一身 + Looks ---------- */
.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:stretch}
.fit,.lookcard{background:var(--card);border-radius:var(--r-lg);padding:14px 16px}
.fit h3,.lookcard h3{margin:0 0 10px;font:400 15px/1.2 var(--serif);font-style:italic}
.pieces{display:flex;flex-wrap:wrap;gap:6px}
.piece{display:flex;align-items:center;gap:7px;border:0;background:var(--tile);padding:4px 11px 4px 4px;border-radius:999px;font-size:12px;max-width:170px}
.piece img{width:30px;height:30px;object-fit:contain;border-radius:50%;background:#fff;padding:2px;flex:0 0 auto}
.piece .ph{width:30px;height:30px;border:1.5px dashed var(--line);border-radius:50%;flex:0 0 auto;background:#fff}
.piece span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.piece.saved{opacity:.75}
.piece.none{color:var(--soft);background:none;border:1px dashed var(--line);cursor:pointer}
.piece.none:hover{color:var(--ink);border-color:var(--ink)}
.piece.has:hover{background:var(--tile-hi)}
.piece.has:hover span::after{content:" · 脱下";color:var(--soft)}
.fitrow{display:flex;gap:12px;align-items:center;margin-top:10px}
.wear{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;background:var(--tile);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:5px 11px;font-size:12px;color:var(--soft);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.gobox{display:flex;flex-direction:column;align-items:center;gap:4px;margin-left:auto;min-width:130px}
.go{width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:11px 20px;font-size:13.5px;font-weight:500;letter-spacing:.06em}
.go:hover:not(:disabled){background:#000}
.go:disabled{background:var(--faint);cursor:not-allowed}
.cost{margin:0;font-size:11px;color:var(--soft);text-align:center;min-height:16px}
.msg{margin:10px 0 0;padding:8px 12px;border-radius:var(--r-sm);font-size:12.5px;color:var(--danger);background:#FBEDEA}
.msg:empty{display:none}
.lookwrap{position:relative}
.looks{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;scroll-snap-type:x proximity;scroll-behavior:smooth}
.looks::-webkit-scrollbar{display:none}
.lookwrap.l .looks{-webkit-mask-image:linear-gradient(90deg,transparent,#000 48px);mask-image:linear-gradient(90deg,transparent,#000 48px)}
.lookwrap.r .looks{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.lookwrap.l.r .looks{-webkit-mask-image:linear-gradient(90deg,transparent,#000 48px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,transparent,#000 48px,#000 calc(100% - 48px),transparent)}
.lookwrap .nav{position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border:0;border-radius:50%;background:rgba(255,255,255,.95);
  box-shadow:0 2px 8px rgba(0,0,0,.12);color:var(--ink);font-size:15px;line-height:30px;padding:0;opacity:0;pointer-events:none;transition:opacity .2s}
.lookwrap .nav.prev{left:-6px}.lookwrap .nav.next{right:-6px}
.lookcard:hover .lookwrap.l .nav.prev,.lookcard:hover .lookwrap.r .nav.next{opacity:1;pointer-events:auto}
.lookwrap .nav:hover{background:var(--ink);color:#fff}
.look{scroll-snap-align:start}
.look{position:relative;flex:0 0 96px}
.look button.v{display:block;width:100%;padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:var(--tile-hi)}
.look img{width:100%;height:100%;object-fit:cover;display:block}
.look.on button.v{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.look .x{top:-6px;right:-6px;width:18px;height:18px;line-height:18px;font-size:11px}

/* ---------- 镜子 ---------- */
.mirrorcol{min-width:0;display:flex}
.mirrorcol .stage{aspect-ratio:auto;height:100%;flex:1}
.stage{position:relative;aspect-ratio:3/4;width:100%;border-radius:var(--r-lg);overflow:hidden;background:#F7F6F3;perspective:1400px;touch-action:pan-y;user-select:none;transition:background-color .6s}
.stage::after{content:"";position:absolute;left:30%;right:30%;bottom:7%;height:4%;border-radius:50%;background:radial-gradient(closest-side,rgba(40,30,20,.16),transparent);pointer-events:none}
.model{position:absolute;inset:7% 9% 9%;transform-style:preserve-3d;transition:transform .8s var(--ease)}
.breathe{position:absolute;inset:0;animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.006)}}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .45s ease}
.frame.show{opacity:1}
/* 色卡：仿色卡样式，竖排在人物左侧 */
.stage.withpal .model{left:24%;right:4%}
.palette{position:absolute;left:5%;top:10%;width:17%;min-width:64px;max-width:100px;display:flex;flex-direction:column;gap:10px;z-index:2;pointer-events:none}
.pchip{background:#fff;box-shadow:0 2px 7px rgba(40,30,20,.10);display:block;opacity:0;transform:translateX(-6px);animation:pin .5s var(--ease) forwards}
.pchip .swatch{aspect-ratio:1.25/1}
.pchip .lb{padding:4px 6px 5px;font:500 8.5px/1.35 var(--sans);color:#3a3936;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.pchip .lb .en{color:var(--soft)}
.pchip .lb b{display:block;font:600 7.5px/1.4 var(--sans);letter-spacing:.14em}
@keyframes pin{to{opacity:1;transform:none}}
.frame.vid{transition:opacity .35s ease}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--soft);padding:32px}
.empty b{font:400 30px/1.2 var(--serif);font-style:italic;color:var(--ink)}
.empty button{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:10px 20px;font-size:13px}
.badge{position:absolute;left:14px;top:14px;background:rgba(27,27,26,.72);color:#fff;backdrop-filter:blur(6px);border-radius:999px;padding:3px 11px;font-size:12px}
.acts{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.acts button{border:0;border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);padding:5px 12px;font-size:12px}
.acts button:hover{background:var(--ink);color:#fff}
.busy{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:999px;padding:9px 18px;font-size:13px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.busy i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.turnhint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:11.5px;color:var(--soft);pointer-events:none}

/* ---------- 弹层 ---------- */
.veil{position:fixed;inset:0;z-index:30;background:rgba(238,237,234,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border-radius:var(--r-lg);padding:24px;width:min(440px,100%);box-shadow:0 30px 60px rgba(0,0,0,.08)}
.sheet h3{margin:0 0 14px;font:400 20px/1.2 var(--serif);font-style:italic}
.previews{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.previews img{width:72px;height:90px;object-fit:cover;background:var(--tile);border-radius:var(--r-sm)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cats button{border:0;border-radius:999px;background:var(--tile);padding:6px 14px;font-size:13px;color:var(--soft)}
.cats button[aria-pressed="true"]{background:var(--ink);color:#fff}
.field{width:100%;border:0;border-bottom:1px solid var(--line);padding:9px 2px;font-size:14px;background:none;outline:0}
.field:focus{border-bottom-color:var(--ink)}
.opt{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px}
.opt input{margin-top:4px;accent-color:var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn{border:0;border-radius:999px;padding:9px 20px;font-size:13px;background:var(--tile)}
.btn.dark{background:var(--ink);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(420px,100%);background:var(--card);padding:24px;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.08);animation:slide .35s var(--ease)}
@keyframes slide{from{transform:translateX(100%)}}
.drawer h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font:400 22px/1.2 var(--serif);font-style:italic}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.photo{position:relative}
.photo .pick{display:block;width:100%;aspect-ratio:3/4;border:0;padding:0;border-radius:var(--r);overflow:hidden;background:var(--tile)}
.photo .pick img{width:100%;height:100%;object-fit:cover;display:block}
.photo.on .pick{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.photo .tag{font-size:12px;color:var(--soft);margin-top:4px}
.photo .mk{width:100%;margin-top:6px;border:0;border-radius:999px;background:var(--tile);font-size:12px;padding:6px}
.photo .mk:hover:not(:disabled){background:var(--ink);color:#fff}
.photo .x{opacity:1;top:6px;right:6px}
.addp{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;border:1.5px dashed var(--faint);border-radius:var(--r);background:none;color:var(--soft);font-size:13px;width:100%}

@media (max-width:1300px){.bottom{grid-template-columns:1fr}}
@media (max-width:1000px){
  .mirrorcol .stage{aspect-ratio:3/4;height:auto}
  .shelfwrap{grid-template-columns:1fr}
  .shelflabel{padding:0 0 4px 4px}
  .top{padding:14px 16px 0}
  .room{grid-template-columns:1fr;padding:6px 16px 24px}
  .mirrorcol{width:100%;min-width:0;order:-1}
  .fit{grid-template-columns:1fr}
  .gobox{min-width:0}
  .rail{padding:0 16px;justify-content:flex-start}
  .x{opacity:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">e<i>·</i>closet</div>
  <span class="demo" id="demo" hidden>演示模式 · 还没填 key</span>
  <button class="link" id="open-photos">我的照片</button>
</header>

<div class="room">
  <section class="closet" aria-label="衣橱">
    <div class="rack">
      <div class="rod"></div>
      <button class="rackadd" id="rackadd">+ 挂一件</button>
      <div class="rail" id="rail"></div>
      <div class="caption" id="caption" aria-live="polite"></div>
    </div>
    <div class="shelfwrap" id="shelfwrap" aria-label="鞋和配饰">
      <span class="shelflabel">鞋 · 配饰</span>
      <div class="shelf" id="shelf"></div>
      <div class="ledge"></div>
    </div>
    <div class="bottom">
    <section class="fit" aria-label="今天这一身">
      <h3>今天这一身</h3>
      <div class="pieces" id="pieces"></div>
      <div class="fitrow">
      <div class="wear" id="wear">
        <div class="seg" data-k="tuck"><button data-v="in">塞进裤子</button><button data-v="out">放在外面</button></div>
        <div class="seg" data-k="sleeves"><button data-v="down">袖子放下</button><button data-v="rolled">卷到手肘</button></div>
        <div class="seg" data-k="collar"><button data-v="open">解开一粒</button><button data-v="closed">全部扣好</button></div>
      </div>
      <div class="gobox"><button class="go" id="go">生成试穿</button><p class="cost" id="cost"></p></div>
      </div>
      <p class="msg" id="msg" role="alert"></p>
    </section>
    <section class="lookcard" aria-label="穿过的搭配">
      <h3>Looks</h3>
      <div class="lookwrap" id="lookwrap"><button class="nav prev" aria-label="往前" id="lprev">‹</button><div class="looks" id="looks"></div><button class="nav next" aria-label="往后" id="lnext">›</button></div>

<input type="file" id="file" accept="image/*,.heic,.heif" multiple hidden>
<div id="layer"></div>

<script>
const LABEL={person:'我的照片',shirt:'衬衫',pants:'裤子',belt:'腰带',shoes:'鞋子',hat:'帽子',accessory:'配饰'};
/* 木衣架：金属挂钩 + 木头肩；裤架：直杆 + 两个夹子 */
const HANGER=`<svg class="hook" viewBox="0 0 100 40"><path d="M50 19c0-4 5-4.5 5-9.5a5 5 0 0 0-10 0" fill="none" stroke="#9d9d9d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M50 17 6 33c-3 1-3 5 1 5h86c4 0 4-4 1-5z" fill="url(#w)"/><defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8714C"/><stop offset="1" stop-color="#7A4E33"/></linearGradient></defs></svg>`;
const PANTS_HOOK=`<svg class="hook" viewBox="0 0 100 40"><path d="M50 19c0-4 5-4.5 5-9.5a5 5 0 0 0-10 0" fill="none" stroke="#9d9d9d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M50 17v8" stroke="#9d9d9d" stroke-width="2.2"/><rect x="10" y="24" width="80" height="6" rx="3" fill="#8A5A3B"/></svg>`;
const S_HOOK=`<svg class="hook" viewBox="0 0 100 40"><path d="M50 19c0-4 5-4.5 5-9.5a5 5 0 0 0-10 0M50 19c0 5-6 6-6 11a6 6 0 0 0 12 0" fill="none" stroke="#9d9d9d" stroke-width="2.2" stroke-linecap="round"/></svg>`;
const HOOK_ONLY=`<svg class="hook" viewBox="0 0 28 50"><defs><linearGradient id="chrome" x1="0" x2="1"><stop offset="0" stop-color="#8d8d8d"/><stop offset=".45" stop-color="#e9e9e9"/><stop offset="1" stop-color="#9a9a9a"/></linearGradient></defs>
  <path d="M14 50V15A6.2 6.2 0 1 1 26 13.5" fill="none" stroke="url(#chrome)" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const CLIPS=`<svg class="clips" viewBox="0 0 100 40"><rect x="18" y="26" width="9" height="11" rx="2" fill="#a9a9a9"/><rect x="73" y="26" width="9" height="11" rx="2" fill="#a9a9a9"/></svg>`;
const $=id=>document.getElementById(id);
function h(tag,attrs={},...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='style')e.setAttribute('style',v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
  for(const k of kids.flat())if(k!=null)e.append(k);return e}
const hoverable=matchMedia('(hover:hover)').matches;

let S={items:[],looks:[],config:{}};
let beltNote=false, job=null, viewing=null, peek=false, est=null, estKey='', estTimer=null, portraiting=null, hovered=null;
const blank={person:null,shirt:null,pants:null,belt:null,shoes:null,hat:null,accessories:[],tuck:'in',sleeves:'down',collar:'open'};
let sel={...blank};
try{sel={...blank,...JSON.parse(localStorage.getItem('sel')||'{}')}}catch(e){}
const keep=()=>{try{localStorage.setItem('sel',JSON.stringify(sel))}catch(e){}};

async function api(path,opts={}){
  let r;
  try{r=await fetch(path,opts)}catch(e){throw new Error('连不上本地服务。确认终端里的 python app.py 还在运行。')}
  if(!r.ok){let d='';try{d=(await r.json()).detail}catch(e){} throw new Error(d||`请求失败（${r.status}）`)}
  return r.json();
}
const item=id=>S.items.find(i=>i.id===id);
const src=i=>`/media/items/${i.file}`;
const cut=i=>i.cut?`/media/items/${i.cut}`:src(i);
const of=c=>S.items.filter(i=>i.category===c);
const nameOf=i=>i.name||LABEL[i.category];
function say(t){$('msg').textContent=t||''}

async function refresh(){
  S=await api('/api/state');
  for(const k of['person','shirt','pants','belt','shoes','hat'])if(sel[k]&&!item(sel[k]))sel[k]=null;
  sel.accessories=sel.accessories.filter(item);
  if(!sel.person){const p=of('person')[0];if(p)sel.person=p.id}
  if(viewing)viewing=S.looks.find(l=>l.id===viewing.id)||null;
  keep();render();
}
function render(){$('demo').hidden=!S.config.demo;renderRail();renderShelf();renderFit();renderLooks();renderStage();renderDrawer()}

/* ---------- 衣杆：平时侧挂，划过的那件转成正面 ---------- */
const isOn=i=>i.category==='accessory'?sel.accessories.includes(i.id):sel[i.category]===i.id;
function wearIt(i){
  if(job)return;
  if(i.category==='accessory'){
    const a=sel.accessories;
    if(a.includes(i.id))sel.accessories=a.filter(x=>x!==i.id);
    else if(a.length>=S.config.max_accessories){say(`配饰一次最多 ${S.config.max_accessories} 件。`);return}
    else a.push(i.id);
  }else sel[i.category]=sel[i.category]===i.id?null:i.id;
  if(i.category==='belt'&&sel.belt&&sel.tuck==='out'){sel.tuck='in';beltNote=true}
  viewing=null;say('');keep();render();
}
async function remove(i){
  if(!confirm(`把“${nameOf(i)}”从衣橱里拿走？已经生成的试穿照不受影响。`))return;
  try{await api('/api/items/'+i.id,{method:'DELETE'});await refresh()}catch(e){say(e.message)}
}
const frontId=()=>hovered&&item(hovered)&&['shirt','pants'].includes(item(hovered).category)?hovered:null;
function caption(){
  if(beltNote){beltNote=false;$('caption').replaceChildren(h('b',{},'系上腰带'),h('span',{},'已改成“塞进裤子”，腰带才露得出来；想放在外面可以再改回来'));return}
  const f=frontId()?item(frontId()):hovered&&item(hovered)?item(hovered):null;
  $('caption').replaceChildren(...(f?[h('b',{},nameOf(f)),h('span',{},(isOn(f)?'穿着 · 点一下脱下':'点一下穿上')+(f.person?' · 照片里有人，点“整理”变成干净单品图':''))]:
    of('shirt').length+of('pants').length?[h('span',{},hoverable?'鼠标划过衣服看正面，点一下穿上':'点一下看正面，再点一下穿上')]:[]));
}
/* 衣服被拨开时的摆动：离得越近摆得越大，像真的衣杆上一排衣服被挤了一下 */
function swing(el,amp,delay){
  const sw=el.querySelector('.sw');if(!sw||!sw.animate||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  sw.animate([0,1,-.55,.3,-.13,.05,0].map(k=>({transform:`rotate(${(amp*k).toFixed(2)}deg)`})),
    {duration:1500,delay,easing:'cubic-bezier(.3,.6,.4,1)'});
}
function ripple(center,strength=1){
  const hs=[...document.querySelectorAll('.hang[data-id]')], k=hs.findIndex(e=>e.dataset.id===center);
  if(k<0)return;
  hs.forEach((e,j)=>{const d=j-k;if(Math.abs(d)>7)return;
    swing(e,d===0?2.2*strength:Math.sign(d)*strength*7/Math.abs(d)**.8,Math.abs(d)*45)});
}
function setHover(id){
  const prev=frontId();
  hovered=id;const f=frontId();
  document.querySelectorAll('.hang[data-id]').forEach(e=>e.classList.toggle('front',e.dataset.id===f));
  document.querySelectorAll('.thing[data-id]').forEach(e=>e.classList.toggle('front',e.dataset.id===hovered));
  if(f&&f!==prev)ripple(f);else if(!f&&prev)ripple(prev,.5);
  /* 布料感：转身时衣摆比领口慢半拍，轻轻荡一下再停 */
  const flutter=(id,k)=>{const im=document.querySelector(`.hang[data-id="${id}"] .pick img`);
    if(im&&im.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)
      im.animate([0,1,-.6,.3,-.12,0].map(v=>({transform:`skewX(${(v*5*k).toFixed(2)}deg) scaleY(${(1-Math.abs(v)*.012*k).toFixed(4)})`})),
        {duration:1200,easing:'cubic-bezier(.25,.6,.35,1)'})};
  if(f&&f!==prev)flutter(f,1);
  if(prev&&prev!==f)flutter(prev,-.6);
  caption();
}
function renameSheet(i){
  const name=h('input',{class:'field',value:i.name||'',maxlength:40,placeholder:LABEL[i.category]+'的名字，比如“蓝白细条纹”'});
  const close=()=>$('layer').replaceChildren();
  const save=async()=>{
    try{await api('/api/items/'+i.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value})});
      close();railKey='';await refresh()}catch(e){say(e.message)}};
  name.addEventListener('keydown',e=>{if(e.key==='Enter')save()});
  $('layer').replaceChildren(h('div',{class:'veil',onclick:e=>{if(e.target===e.currentTarget)close()}},
    h('div',{class:'sheet',role:'dialog','aria-label':'改名'},h('h3',{},'改个名字'),
      h('div',{class:'previews'},h('img',{src:cut(i),alt:''})),name,
      i.category==='accessory'?h('p',{class:'muted'},'写清楚是什么（项链、耳环、手表、包…），换装时模型靠名字决定戴在哪。'):null,
      h('div',{class:'row'},h('button',{class:'btn',onclick:close},'取消'),h('button',{class:'btn dark',onclick:save},'保存')))));
  name.focus();name.select();
}
async function tidy(i,btn){
  btn.disabled=true;btn.textContent='整理中…';say('');
  $('caption').replaceChildren(h('span',{},'正在用即梦整理这件衣服，通常要 20–60 秒…'));
  try{await api(`/api/items/${i.id}/tidy`,{method:'POST'});await refresh()}catch(e){say(e.message);btn.disabled=false;btn.textContent='整理'}
}
/* 按肩宽缩放衬衫：肩膀正好压在衣架两臂上，挂钩从领口里出来 */
function shirtFit(i){
  const f=i.fit;
  if(f&&f.own&&i.cut){  /* 自带衣架：挂钩顶端碰到衣杆，挂钩在中间 */
    const w=Math.min(200,300/f.ar), hh=w*f.ar;
    return `left:${(100-f.hx*w).toFixed(1)}px;right:auto;width:${w.toFixed(1)}px;top:${(40-(f.ty||0)*hh).toFixed(1)}px;height:${hh.toFixed(1)}px;bottom:auto`;
  }
  if(i.category!=='shirt'||!i.cut||!f||!f.sw||f.sw<.2)return null;
  const w=Math.max(130,Math.min(260,132/f.sw,300/f.ar)), hh=w*f.ar, nx=f.nx??f.cx;
  return `left:${(100-nx*w).toFixed(1)}px;right:auto;width:${w.toFixed(1)}px;top:8px;height:${hh.toFixed(1)}px;bottom:auto`;
}
function hangEl(i,n){
  const img=h('img',{src:cut(i),alt:nameOf(i),draggable:'false',class:i.cut?'':'card',loading:'lazy'});
  const el=h('div',{class:`hang ${i.category}`+(isOn(i)?' on':''),'data-id':i.id,
      style:`--d:${-(n*1.37%5).toFixed(2)}s;--t:${(5.2+n*0.7%2.4).toFixed(2)}s`},
    h('span',{class:'mark'}),
    h('div',{class:'sw'},h('div',{class:'g'},(i.fit&&i.fit.own)?h('span',{class:'ownhook',html:HOOK_ONLY}):h('span',{html:i.category==='pants'?PANTS_HOOK:i.category==='belt'?S_HOOK:HANGER}),
      h('button',{class:'pick','aria-pressed':String(isOn(i)),style:shirtFit(i),'aria-label':nameOf(i)+(isOn(i)?'（穿着）':''),
        onclick(){ if(!hoverable&&hovered!==i.id){setHover(i.id);return} ripple(i.id,.8);wearIt(i)},
        onfocus(){setHover(i.id)}},img),
      i.category==='pants'&&!(i.fit&&i.fit.own)?h('span',{html:CLIPS}):null)),
    h('div',{class:'tools'},h('button',{class:'t',onclick:()=>renameSheet(i)},'改名'),S.config.demo?null:h('button',{class:'t',title:'用即梦整理成干净的白底单品图'+(S.config.tidy_cost?`，约 ¥${S.config.tidy_cost.toFixed(2)}`:''),onclick(e){tidy(i,e.currentTarget)}},'整理'),
      h('button',{class:'x','aria-label':'拿走',title:'拿走',onclick:()=>remove(i)},'×')));
  el.addEventListener('mouseenter',()=>setHover(i.id));
  return el;
}
let railKey='';
function renderRail(){
  const list=[...of('shirt'),...of('pants')];
  const rail=$('rail'), key=list.map(i=>i.id+(i.cut||'')+i.name).join()+S.config.demo;
  if(key===railKey){  /* 只是穿上/脱下：不重画，免得打断摆动 */
    rail.querySelectorAll('.hang[data-id]').forEach(e=>{const i=item(e.dataset.id);e.classList.toggle('on',isOn(i));
      e.querySelector('.pick').setAttribute('aria-pressed',String(isOn(i)))});
    caption();return;
  }
  railKey=key;
  rail.replaceChildren(...list.map(hangEl));
  rail.onmouseleave=()=>setHover(null);
  if(!list.length)rail.append(h('div',{class:'railempty'},'衣杆还空着，点右上角“+ 挂一件”挂上你的衬衫和裤子'));
  const keepFront=hovered&&item(hovered)?hovered:null;hovered=null;setHover(keepFront);
}
$('rackadd').addEventListener('click',()=>pickFiles('shirt'));
/* Looks 用滚轮也能左右滑 */
const lookEdges=()=>{const l=$('looks'),w=$('lookwrap');w.classList.toggle('l',l.scrollLeft>4);w.classList.toggle('r',l.scrollLeft+l.clientWidth<l.scrollWidth-4)};
$('looks').addEventListener('scroll',lookEdges,{passive:true});addEventListener('resize',lookEdges);
$('lprev').addEventListener('click',()=>{const l=$('looks');l.scrollLeft-=l.clientWidth*.8});
$('lnext').addEventListener('click',()=>{const l=$('looks');l.scrollLeft+=l.clientWidth*.8});
/* 按住拖动也能左右切换 */
{let down=false,sx=0,sl=0,moved=false;const l=$('looks');
  l.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=false;sx=e.clientX;sl=l.scrollLeft});
  addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>4){moved=true;l.style.scrollBehavior='auto';l.scrollLeft=sl-dx}});
  addEventListener('pointerup',()=>{if(down){down=false;l.style.scrollBehavior=''}});
  l.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);}
$('looks').addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.currentTarget.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
/* 鞋架上大小统一：按“实心部分的面积”缩放，而不是按图片外框，细长的项链和宽大的鞋看起来一样分量 */
function shelfSize(i){
  const f=i.fit; if(!i.cut||!f||!f.fill)return null;
  const area=5200, w0=Math.sqrt(area/(f.fill*f.ar));
  let w=Math.min(118,Math.max(44,w0)), hh=w*f.ar;
  if(hh>84){hh=84;w=hh/f.ar}
  return `width:${w.toFixed(0)}px;height:${hh.toFixed(0)}px`;
}
function renderShelf(){
  const list=[...of('shoes'),...of('belt'),...of('hat'),...of('accessory')];
  $('shelf').replaceChildren(...list.map(i=>{
    const el=h('div',{class:'thing'+(isOn(i)?' on':''),'data-id':i.id},
      h('button',{class:'pick','aria-pressed':String(isOn(i)),'aria-label':nameOf(i),style:shelfSize(i),onclick:()=>wearIt(i)},
        h('img',{src:cut(i),alt:nameOf(i),draggable:'false',class:i.cut?'':'card'})),
      h('div',{class:'tools'},h('button',{class:'t',onclick:()=>renameSheet(i)},'改名'),h('button',{class:'x','aria-label':'拿走',title:'拿走',onclick:()=>remove(i)},'×')));
    el.addEventListener('mouseenter',()=>{hovered=i.id;$('caption').replaceChildren(h('b',{},nameOf(i)),h('span',{},isOn(i)?'穿着 · 点一下脱下':'点一下穿上'))});
    el.addEventListener('mouseleave',()=>setHover(null));
    return el;
  }),h('div',{class:'thing add'},h('button',{title:'添加鞋子或配饰',onclick:()=>pickFiles('shoes')},'+')),
    ...(list.length?[]:[h('span',{class:'muted'},'鞋子和配饰放在这里')]));
}

/* ---------- 镜子 ---------- */
let playOnce=null;
function frames(){
  if(viewing&&!peek)return['/media/results/'+viewing.file+'?t='+viewing.created];
  if(peek&&viewing&&viewing.person_file)return['/media/results/'+viewing.person_file];
  const p=item(peek&&viewing&&viewing.sel?viewing.sel.person_id:sel.person);
  return p?[src(p)]:[];
}
const vid=()=>$('frames').querySelector('video');
/* 转一圈：正面站着 → 原地转身一周 → 回到正面。视频最后一帧和静态图是同一个姿势，播完淡回静态图 */
function playTurn(from=0){
  const v=vid();if(!v)return;
  v.currentTime=from;v.classList.add('show');
  v.play().catch(()=>{});
}
function renderStage(){
  const st=$('stage'), list=frames();
  st.querySelectorAll('.empty,.badge,.acts,.busy,.turnhint').forEach(e=>e.remove());
  $('frames').replaceChildren(...list.map((u,n)=>h('img',{class:'frame'+(n===0?' show':''),src:u,alt:'试穿效果',draggable:'false'})));
  matchBackdrop();
  const pal=viewing&&!peek&&viewing.palette&&viewing.palette.length?viewing.palette:null;
  st.classList.toggle('withpal',!!pal);
  st.querySelectorAll('.palette').forEach(e=>e.remove());
  if(pal)st.append(h('div',{class:'palette','aria-label':'这身的配色'},pal.map((c,n)=>h('div',{class:'pchip',style:`animation-delay:${n*70}ms`},
    h('div',{class:'swatch',style:`background:${c.hex}`}),h('div',{class:'lb'},h('b',{},'E·CLOSET'),c.hex,h('br'),c.zh,h('br'),h('span',{class:'en'},c.en))))));
  const hasVid=viewing&&viewing.video&&!peek&&!job;
  if(hasVid){
    const v=h('video',{class:'frame vid',src:'/media/results/'+viewing.video+'?t='+viewing.created,muted:true,playsinline:true,preload:'auto'});
    v.muted=true;v.addEventListener('ended',()=>v.classList.remove('show'));
    $('frames').append(v);
    if(playOnce===viewing.id){playOnce=null;v.addEventListener('loadeddata',()=>playTurn(),{once:true})}
  }
  if(!list.length){
    st.append(h('div',{class:'empty'},h('b',{},'Hello.'),'先放一张自己的全身照，再从衣杆上挑一件衬衫。',
      h('button',{onclick:()=>openDrawer()},'放一张照片')));
  }else if(peek||!viewing)st.append(h('span',{class:'badge'},'原照'));
  else if(viewing.demo)st.append(h('span',{class:'badge'},'演示图'));
  if(viewing&&!job){
    const acts=h('div',{class:'acts'});
    const b=h('button',{'aria-pressed':String(peek)},peek?'松开回到搭配':'按住看原照');
    const off=()=>{removeEventListener('pointerup',off);removeEventListener('pointercancel',off);removeEventListener('blur',off);
      if(peek){peek=false;renderStage()}};
    b.addEventListener('pointerdown',e=>{e.preventDefault();peek=true;renderStage();
      addEventListener('pointerup',off);addEventListener('pointercancel',off);addEventListener('blur',off)});
    b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!peek){e.preventDefault();peek=true;renderStage();addEventListener('keyup',function u(){removeEventListener('keyup',u);off()})}});
    acts.append(b);
    acts.append(viewing.video?h('button',{onclick:()=>playTurn()},'转一圈'):
      h('button',{title:'生成一段原地转身一周的视频'+(S.config.turn_cost?`，约 ¥${S.config.turn_cost.toFixed(2)}`:''),onclick:makeTurn},'转一圈'));
    if(!viewing.demo)acts.append(h('button',{title:'哪里不对就只修哪里',onclick:fixSheet},'修一下'));
    if(viewing.history&&viewing.history.length)acts.append(h('button',{onclick:undoFix},'撤销修改'));
    acts.append(h('button',{onclick:()=>generate(true)},'重新生成'));
    st.append(acts);
  }
  if(hasVid)st.append(h('div',{class:'turnhint'},hoverable?'左右拖动看转身，松手转回正面':'左右滑动看转身'));
  if(job)st.append(h('div',{class:'busy'},h('i'),(job.step||'生成中')+` · ${Math.round((Date.now()-jobStart)/1000)} 秒`));
}
function matchBackdrop(){  /* 背景取照片边缘的颜色，让人像和背景连成一片 */
  const f=$('frames').querySelector('img'), st=$('stage');
  if(!f){st.style.backgroundColor='';return}
  const go=()=>{try{
    const c=document.createElement('canvas');c.width=c.height=1;const x=c.getContext('2d',{willReadFrequently:true});
    const w=f.naturalWidth,hh=f.naturalHeight,s=Math.max(4,Math.round(w*.04)),px=[];
    for(const[sx,sy]of[[0,0],[w-s,0],[0,hh*.4],[w-s,hh*.4]]){x.drawImage(f,sx,sy,s,s,0,0,1,1);px.push(x.getImageData(0,0,1,1).data)}
    const avg=k=>Math.round(px.reduce((a,p)=>a+p[k],0)/px.length);
    st.style.backgroundColor=`rgb(${avg(0)},${avg(1)},${avg(2)})`;
  }catch(e){}};
  f.complete&&f.naturalWidth?go():f.addEventListener('load',go,{once:true});
}
/* 有转身视频时，左右拖动就是在视频里来回转；松手后接着转完、回到正面 */
let dragging=false, dragX=0, dragT=0;
$('stage').addEventListener('pointermove',e=>{
  const r=e.currentTarget.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, v=vid();
  if(dragging&&v&&v.duration){v.currentTime=Math.max(0,Math.min(v.duration-.05,dragT+(e.clientX-dragX)/r.width*v.duration));return}
  if(hoverable)$('model').style.transform=`rotateY(${(x*9).toFixed(2)}deg)`;
});
$('stage').addEventListener('pointerleave',()=>{$('model').style.transform='';if(dragging){dragging=false;playTurn(vid()?vid().currentTime:0)}});
$('stage').addEventListener('pointerdown',e=>{const v=vid();if(v&&v.duration&&!e.target.closest('button')){
  dragging=true;dragX=e.clientX;v.pause();if(!v.classList.contains('show')){v.currentTime=0;v.classList.add('show')}dragT=v.currentTime}});
addEventListener('pointerup',()=>{if(dragging){dragging=false;playTurn(vid()?vid().currentTime:0)}});

/* ---------- 今天这一身 ---------- */
function body(force=false){
  return{person_id:sel.person,shirt_id:sel.shirt,pants_id:sel.pants,belt_id:sel.belt,shoes_id:sel.shoes,hat_id:sel.hat,accessory_ids:sel.accessories,
    tuck:sel.tuck,sleeves:sel.sleeves,collar:sel.collar,force};
}
function estimate(){
  const k=JSON.stringify(body());
  if(k===estKey)return;
  estKey=k;est=null;clearTimeout(estTimer);
  if(!sel.person||!(sel.shirt||sel.pants||sel.belt||sel.shoes||sel.hat||sel.accessories.length))return;
  estTimer=setTimeout(async()=>{
    try{const r=await api('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:k});if(k===estKey){est=r;renderFit()}}catch(e){}
  },200);
}
function pointTo(cat){
  const el=['shoes','belt','hat','accessory'].includes(cat)?$('shelfwrap'):$('rail');
  el.scrollIntoView({behavior:'smooth',block:'center'});
  if(el.id==='shelfwrap'){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),900)}
  if(['shoes','hat','belt'].includes(cat)&&!of(cat).length)pickFiles(cat);
}
function renderFit(){
  const chip=(cat,i,drop)=>i?h('button',{class:'piece has',title:'脱下',onclick:()=>{if(!job)drop()}},h('img',{src:cut(i),alt:''}),h('span',{},nameOf(i))):
    h('button',{class:'piece none',title:cat==='shoes'?'鞋子在衣杆下面的鞋架上':'在上面的衣杆上挑',onclick:()=>pointTo(cat)},h('i',{class:'ph'}),h('span',{},cat==='shirt'?'挑一件衬衫':cat==='shoes'||cat==='hat'?LABEL[cat]+' ↑ 鞋架':cat==='belt'?'腰带 ↑ 鞋架':LABEL[cat]));
  const drop=k=>()=>{sel[k]=null;viewing=null;keep();render()};
  const gone=viewing&&viewing.pieces?viewing.pieces.filter(p=>{const q=viewing.sel||{};
    const id=p.category==='accessory'?null:q[p.category+'_id'];return p.category==='accessory'?false:!item(id)}):[];
  if(gone.length){
    $('pieces').replaceChildren(...(viewing.pieces||[]).map(p=>h('span',{class:'piece saved',title:'这件已经从衣橱拿走，只保存在这套搭配里'},
      h('img',{src:'/media/results/'+p.file,alt:''}),h('span',{},p.name||LABEL[p.category]))));
  }else $('pieces').replaceChildren(
    chip('shirt',item(sel.shirt),drop('shirt')),chip('pants',item(sel.pants),drop('pants')),...(sel.belt?[chip('belt',item(sel.belt),drop('belt'))]:[]),
    chip('shoes',item(sel.shoes),drop('shoes')),...(sel.hat?[chip('hat',item(sel.hat),drop('hat'))]:[]),
    ...sel.accessories.map(id=>chip('accessory',item(id),()=>{sel.accessories=sel.accessories.filter(x=>x!==id);viewing=null;keep();render()})));
  $('wear').hidden=!sel.shirt;
  document.querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(sel[g.dataset.k]===b.dataset.v))));
  estimate();
  const any=!!(sel.shirt||sel.pants||sel.belt||sel.shoes||sel.hat||sel.accessories.length), go=$('go');
  go.disabled=!!job||!sel.person||!any;
  go.textContent=job?'正在生成…':est&&est.cached?'调出这一身':'生成试穿';
  $('cost').textContent=!sel.person?'先在“我的照片”放一张全身照':!any?'':!est?'':
    est.cached?'生成过，直接调出':S.config.demo?'演示模式':`约 ¥${est.cost.toFixed(2)}`;
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{if(job)return;sel[b.parentElement.dataset.k]=b.dataset.v;viewing=null;keep();render()}));

function renderLooks(){
  requestAnimationFrame(lookEdges);
  $('looks').replaceChildren(...(S.looks.length?S.looks.map(l=>h('div',{class:'look'+(viewing&&viewing.id===l.id?' on':'')},
    h('button',{class:'v','aria-label':'查看这套搭配',onclick(){
      const q=l.sel||{};
      sel={...sel,person:item(q.person_id)?q.person_id:sel.person,shirt:item(q.shirt_id)?q.shirt_id:null,pants:item(q.pants_id)?q.pants_id:null,
        belt:item(q.belt_id)?q.belt_id:null,hat:item(q.hat_id)?q.hat_id:null,shoes:item(q.shoes_id)?q.shoes_id:null,accessories:(q.accessory_ids||[]).filter(item),tuck:q.tuck||'in',sleeves:q.sleeves||'down',collar:q.collar||'open'};
      viewing=l;if(l.video)playOnce=l.id;say('');keep();render()}},h('img',{src:'/media/results/'+l.file+'?t='+l.created,alt:'',loading:'lazy'})),
    h('button',{class:'x','aria-label':'删除',onclick:async()=>{if(!confirm('删除这张试穿照？'))return;
      try{await api('/api/looks/'+l.id,{method:'DELETE'});await refresh()}catch(e){say(e.message)}}},'×'))):
    [h('span',{class:'muted'},'生成过的会留在这里')]));
}

/* ---------- 生成 ---------- */
let jobStart=0;
async function follow(r){
  if(r.cached){viewing=r.look;render();return}
  job=r.job;jobStart=Date.now();render();
  while(job.status==='running'){
    await new Promise(ok=>setTimeout(ok,900));
    job=await api('/api/jobs/'+job.id);renderStage();
  }
  const done=job;job=null;
  if(done.status==='error'){say(done.error);render();return}
  viewing=done.look;estKey='';await refresh();
}
async function generate(force=false){
  if(job)return;say('');
  try{await follow(await api('/api/tryon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body(force))}))}
  catch(e){job=null;say(e.message);render()}
}
/* 修一下：勾选不对的部分 + 一句说明，只修这些地方 */
function fixSheet(){
  const q=viewing.sel||{}, opts=[];
  for(const k of['shirt','pants','belt','shoes','hat'])if(q[k+'_id'])opts.push([k,LABEL[k]]);
  if((q.accessory_ids||[]).length)opts.push(['accessory','配饰']);
  opts.push(['face','长相（脸和发型）']);
  if(q.shirt_id)opts.push(['wear','穿法（塞/放、袖子、领口）']);
  opts.push(['background','白底']);
  const on=new Set();
  const cats=h('div',{class:'cats'}), paint=()=>cats.replaceChildren(...opts.map(([k,v])=>h('button',{'aria-pressed':String(on.has(k)),onclick:()=>{on.has(k)?on.delete(k):on.add(k);paint()}},v)));
  paint();
  const note=h('input',{class:'field',maxlength:200,placeholder:'哪里不对？比如“鞋带应该是红色的”“袖子要卷起来”（可选）'});
  const close=()=>$('layer').replaceChildren();
  const ok=h('button',{class:'btn dark',async onclick(){
    if(!on.size&&!note.value.trim()){note.focus();return}
    close();say('');
    try{await follow(await api(`/api/looks/${viewing.id}/fix`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parts:[...on],note:note.value})}))}
    catch(e){job=null;say(e.message);render()}
  }},'只修这些');
  $('layer').replaceChildren(h('div',{class:'veil',onclick:e=>{if(e.target===e.currentTarget)close()}},
    h('div',{class:'sheet',role:'dialog','aria-label':'修一下'},h('h3',{},'哪里不对？'),
      h('p',{class:'muted',style:'margin:-6px 0 12px'},'只改勾选的部分，其他保持不变'+(S.config.fix_cost?`，约 ¥${S.config.fix_cost.toFixed(2)}`:'')+'。修坏了可以撤销。'),
      cats,note,h('div',{class:'row'},h('button',{class:'btn',onclick:close},'取消'),ok))));
}
async function undoFix(){
  if(job||!viewing)return;
  try{viewing=await api(`/api/looks/${viewing.id}/undo`,{method:'POST'});await refresh()}catch(e){say(e.message)}
}
async function makeTurn(){
  if(job||!viewing)return;say('');playOnce=viewing.id;
  try{await follow(await api(`/api/looks/${viewing.id}/turn`,{method:'POST'}))}catch(e){job=null;say(e.message);render()}
}
$('go').addEventListener('click',()=>generate(false));

/* ---------- 上传 ---------- */
let upCat='shirt';
function pickFiles(cat){upCat=cat;$('file').click()}
$('file').addEventListener('change',ev=>{const files=[...ev.target.files];ev.target.value='';if(files.length)uploadSheet(files,upCat)});
function uploadSheet(files,cat){
  const urls=files.map(f=>URL.createObjectURL(f));
  const name=h('input',{class:'field',maxlength:40});
  const tidy=h('input',{type:'checkbox'});
  const tidyRow=h('label',{class:'opt'},tidy,h('span',{},'照片里有模特、衣架或背景很乱：先整理成干净的单品图',h('br'),
    h('span',{class:'muted'},`衣杆上更好看，换装也更准${S.config.tidy_cost?`，每张约 ¥${S.config.tidy_cost.toFixed(2)}`:''}`)));
  const cats=h('div',{class:'cats'});
  const paint=()=>{cats.replaceChildren(...Object.entries(LABEL).map(([k,v])=>h('button',{'aria-pressed':String(cat===k),onclick:()=>{cat=k;paint()}},v)));
    name.placeholder=cat==='belt'?'比如“棕色皮带 金扣”':cat==='hat'?'比如“灰色棒球帽”':cat==='accessory'?'写清楚是什么：项链、耳环、手表、腰带、包…':cat==='person'?'比如“周末”（可选）':'起个名字，比如“蓝白细条纹”（可选）';
    tidyRow.hidden=cat==='person'};
  paint();
  const close=()=>{urls.forEach(u=>URL.revokeObjectURL(u));$('layer').replaceChildren();if(drawerOpen)renderDrawer()};
  const ok=h('button',{class:'btn dark',async onclick(){
    ok.disabled=true;
    let n=0;
    for(const f of files){
      ok.textContent=tidy.checked?`整理中 ${++n}/${files.length}…`:'放进衣橱…';
      const fd=new FormData();fd.append('file',f);fd.append('category',cat);fd.append('name',name.value);fd.append('tidy',tidy.checked&&cat!=='person'?'1':'');
      try{const it=await api('/api/items',{method:'POST',body:fd});if(cat==='person'||(cat!=='accessory'&&!sel[cat]))sel[cat]=it.id}catch(e){say(e.message)}
    }
    close();viewing=null;await refresh();
  }},'放进衣橱');
  $('layer').replaceChildren(h('div',{class:'veil',onclick:e=>{if(e.target===e.currentTarget)close()}},
    h('div',{class:'sheet',role:'dialog','aria-label':'添加单品'},h('h3',{},'这是什么？'),
      h('div',{class:'previews'},urls.map(u=>h('img',{src:u,alt:''}))),cats,name,tidyRow,
      h('div',{class:'row'},h('button',{class:'btn',onclick:close},'取消'),ok))));
  name.focus();
}

/* ---------- 我的照片 ---------- */
let drawerOpen=false;
function openDrawer(){drawerOpen=true;renderDrawer()}
function renderDrawer(){
  if($('layer').querySelector('.sheet'))return;
  if(!drawerOpen){if($('layer').querySelector('.drawer'))$('layer').replaceChildren();return}
  const close=()=>{drawerOpen=false;renderDrawer()};
  const cards=of('person').map(i=>h('div',{class:'photo'+(sel.person===i.id?' on':'')},
    h('button',{class:'pick',onclick:()=>{sel.person=i.id;viewing=null;keep();render()}},h('img',{src:src(i),alt:i.name||'照片'})),
    h('button',{class:'x','aria-label':'删除',onclick:()=>remove(i)},'×'),
    h('div',{class:'tag'},i.name||'照片'),
    i.from?null:h('button',{class:'mk',disabled:!!portraiting||!!job,title:'保持你的长相和身材，换成正面站姿、贴身基础款、干净背景'+(S.config.portrait_cost?`，约 ¥${S.config.portrait_cost.toFixed(2)}`:''),
      async onclick(){portraiting=i.id;renderDrawer();say('');
        try{const it=await api(`/api/items/${i.id}/portrait`,{method:'POST'});sel.person=it.id;viewing=null;keep()}catch(e){say(e.message)}
        finally{portraiting=null;await refresh()}}},portraiting===i.id?'生成中…':'生成形象照')));
  $('layer').replaceChildren(h('div',{class:'veil',style:'justify-content:flex-end;padding:0',onclick:e=>{if(e.target===e.currentTarget)close()}},
    h('div',{class:'drawer',role:'dialog','aria-label':'我的照片'},
      h('h3',{},'我的照片',h('button',{class:'link',onclick:close},'关闭')),
      h('p',{class:'muted'},'正面站立、头到脚全身入镜、光线均匀。穿贴身短袖和修身长裤，长发拨到肩后，手臂别挡住腰。随手拍的照片可以点“生成形象照”整理成标准底片。'),
      h('div',{class:'photos'},cards,h('button',{class:'addp',onclick:()=>pickFiles('person')},'+ 添加照片')))));
}
$('open-photos').addEventListener('click',openDrawer);
addEventListener('keydown',e=>{if(e.key==='Escape'){drawerOpen=false;$('layer').replaceChildren()}});

refresh().catch(e=>say(e.message));
</script>
