<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-Closet · 定制销售</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEEDEA; --card:#FFFFFF; --tile:#F5F4F1; --tile-hi:#E7E5E0;
  --ink:#1B1B1A; --soft:#86847F; --faint:#B9B6B0; --line:#DEDAD3;
  --accent:#C9895B; --wood:#8A5A3B; --wood-hi:#A8714C; --danger:#B4473A;
  --r-lg:20px; --r:14px; --r-sm:10px;
  --serif:"Fraunces","Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font:400 14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:var(--bg) radial-gradient(circle,rgba(0,0,0,.045) 1.6px,transparent 2px) 0 0/34px 34px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.muted{color:var(--soft);font-size:12.5px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:20px;padding:16px 32px 0}
.brand{font:600 24px/1 var(--serif);letter-spacing:-.01em;margin-right:auto}
.brand i{font-style:normal;color:var(--accent)}
.link{border:0;background:none;padding:6px 2px;font-size:13px;color:var(--soft)}
.link:hover{color:var(--ink)}
.demo{font-size:12px;color:var(--soft);display:inline-flex;align-items:center;gap:7px}
.demo::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}

.room{display:grid;grid-template-columns:minmax(0,2.5fr) minmax(280px,.85fr);gap:28px;padding:6px 32px 28px;align-items:stretch}
.closet{min-width:0;display:flex;flex-direction:column;gap:14px}

/* ---------- 衣杆 ---------- */
.rack{position:relative;padding-top:30px;zoom:var(--rz,1)}
.rod{position:absolute;left:18px;right:18px;top:36px;height:9px;border-radius:5px;z-index:0;
  background:linear-gradient(#fbfbfb 0%,#d6d6d6 30%,#9b9b9b 55%,#c9c9c9 80%,#efefef 100%);box-shadow:0 3px 5px rgba(0,0,0,.14)}
.rod::before,.rod::after{content:"";position:absolute;top:-9px;width:16px;height:27px;border-radius:4px;
  background:linear-gradient(90deg,#d9d9d9,#f6f6f6 45%,#b9b9b9);box-shadow:0 2px 4px rgba(0,0,0,.18)}
.rod::before{left:-8px}.rod::after{right:-8px}
/* 衣服只在衣杆两端支架之间挂：挂得多就互相挤，不会滑出去 */
.rail{position:relative;display:flex;justify-content:center;align-items:flex-start;margin:0 46px;padding-bottom:16px;min-height:330px}
.hang{position:relative;flex:0 1 58px;min-width:9px;height:312px;transition:flex-basis .6s var(--ease),flex-shrink .6s}
.hang.pants{flex-basis:38px}
.hang.belt{flex-basis:26px}
.hang.belt .g .pick{top:34px;left:60px;right:60px;bottom:30px}
.hang.belt.front{flex:0 0 150px}
.hang.front{flex:0 0 232px}
.sw{position:absolute;inset:0;transform-origin:50% 10px}
.g{position:absolute;left:50%;top:0;width:200px;margin-left:-100px;height:296px;transform-origin:50% 10px;
  transform:perspective(900px) rotateY(74deg);transition:transform .75s cubic-bezier(.3,1.32,.5,1),filter .6s;filter:brightness(.9) saturate(.95);
  animation:sway var(--t,6s) ease-in-out var(--d,0s) infinite alternate}
@keyframes sway{from{rotate:-.7deg}to{rotate:.7deg}}
.hang.front .g{transform:perspective(900px) rotateY(0) scale(1.04);filter:none}
/* 衣架在衣服后面：只露出挂钩，肩膀把衣架两头盖住 */
.hook{position:absolute;left:50%;top:0;width:84px;margin-left:-42px;height:34px;z-index:0;pointer-events:none}
.hang.pants .hook{width:100px;margin-left:-50px;height:40px}
/* 写成 .hang .g .ownhook：优先级要高过上面 .hang.pants .hook，不然整理过的裤子会被套上裤架挂钩的尺寸、钩柄被拉长 */
.hang .g .ownhook .hook{width:20px;margin-left:-10px;height:29px;top:0;z-index:0}
.g .pick{position:absolute;left:0;right:0;top:15px;bottom:0;border:0;background:none;padding:0;display:block;z-index:1}
.g .pick img{width:100%;height:100%;object-fit:contain;object-position:50% 0;display:block;transform-origin:50% 0;
  filter:drop-shadow(0 14px 14px rgba(55,45,35,.16))}
.g .pick img.card{background:#fff;border-radius:6px;padding:8px;height:auto;max-height:100%}
.hang.pants .g .pick{top:27px}
.hang.pants .clips{position:absolute;left:50%;top:0;width:100px;margin-left:-50px;height:40px;z-index:2;pointer-events:none}
.hang.on .mark{position:absolute;left:50%;top:-1px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--accent);z-index:3}
.x{position:absolute;width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:13px;line-height:22px;padding:0;color:var(--soft);opacity:0;z-index:4}
.x:hover{color:var(--danger)}
/* 整理衣柜：点了才出现改名、整理、拿走，平时界面上没有这些字 */
.caption .tb{display:flex;gap:6px;height:24px;align-items:center}
.caption .tb button{border:0;border-radius:999px;background:var(--card);font-size:12px;line-height:20px;padding:2px 12px;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.caption .tb button:hover{background:var(--ink);color:#fff}
.caption .tb button.del:hover{background:var(--danger)}
.caption .tb button:disabled{opacity:.5}
.dragging{z-index:5;transition:none!important}
.dragging .sw{filter:drop-shadow(0 16px 18px rgba(40,30,20,.22))}
.thing:hover .x,.look:hover .x,.x:focus-visible{opacity:1}
.caption{position:relative;top:16px;height:52px;margin-top:-4px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center}
.caption b{display:block;font:400 17px/24px var(--serif);font-style:italic;height:24px;white-space:nowrap}
.caption span{font-size:12px;line-height:20px;height:20px;color:var(--soft);white-space:nowrap}
.railempty{position:absolute;left:0;right:0;top:120px;text-align:center;color:var(--soft);pointer-events:none}

/* ---------- 鞋架 ---------- */
.shelfwrap{position:relative;padding:0 28px;border-radius:var(--r);transition:background .4s;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:end}
.shelfwrap .ledge{grid-column:1/-1}
.shelfwrap.flash{background:rgba(201,137,91,.12)}
.shelflabel{padding:0 0 10px 2px;font:400 13px/1 var(--serif);font-style:italic;color:var(--soft);white-space:nowrap}
.shelf{display:flex;gap:18px;align-items:flex-end;justify-content:safe center;overflow-x:auto;scrollbar-width:none;padding:34px 10px 6px;min-height:108px}
.shelf::-webkit-scrollbar{display:none}
.ledge{height:7px;border-radius:4px;background:linear-gradient(#f3f1ed,#d2ccc2);box-shadow:0 4px 8px rgba(0,0,0,.07)}
.thing{position:relative;flex:0 0 88px;min-height:72px;justify-content:flex-end;display:flex;flex-direction:column;align-items:center;transition:transform .35s var(--ease)}
.thing:hover,.thing.front{transform:translateY(-6px) scale(1.12)}
.thing .pick{border:0;background:none;padding:0;width:82px;height:60px;display:flex;align-items:flex-end;justify-content:center}
.thing .pick img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 6px 6px rgba(60,50,40,.14))}
.thing .pick img.card{background:#fff;border-radius:6px;padding:4px}
.thing.on::after{content:"";position:absolute;bottom:-11px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.thing.add button{width:58px;height:58px;border:1.5px dashed var(--faint);border-radius:var(--r);background:none;color:var(--soft);font-size:22px;font-weight:300}
.thing.add button:hover{border-color:var(--ink);color:var(--ink)}
.thing.add{transform:none!important}

/* ---------- 今天这一身 + Looks ---------- */
.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:stretch}
.fit,.lookcard{background:var(--card);border-radius:var(--r-lg);padding:14px 16px}
.fit h3,.lookcard h3{margin:0 0 10px;font:400 15px/1.2 var(--serif);font-style:italic}
.pieces{display:flex;flex-wrap:wrap;gap:6px}
.piece{display:flex;align-items:center;gap:7px;border:0;background:var(--tile);padding:4px 11px 4px 4px;border-radius:999px;font-size:12px;max-width:170px}
.piece img{width:30px;height:30px;object-fit:contain;border-radius:50%;background:#fff;padding:2px;flex:0 0 auto}
.piece .ph{width:30px;height:30px;border:1.5px dashed var(--line);border-radius:50%;flex:0 0 auto;background:#fff}
.piece span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.piece.saved{opacity:.75}
.piece.none{color:var(--soft);background:none;border:1px dashed var(--line);cursor:pointer}
.piece.none:hover{color:var(--ink);border-color:var(--ink)}
.piece.has:hover{background:var(--tile-hi)}
.fitrow{display:flex;gap:12px;align-items:center;margin-top:10px}
.wear{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wearbox{flex:1;min-width:0}
.wearbox summary{cursor:pointer;font-size:12.5px;color:var(--soft);list-style:none;padding:4px 0}
.wearbox summary::-webkit-details-marker{display:none}
.wearbox summary::after{content:" ▾"}
.wearbox[open] summary::after{content:" ▴"}
.wearbox summary:hover{color:var(--ink)}
.acts details{position:relative}
.acts summary{list-style:none;cursor:pointer;border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);padding:5px 12px;font-size:12px;text-align:right;width:max-content;margin-left:auto}
.acts summary::-webkit-details-marker{display:none}
.acts details[open] summary,.acts summary:hover{background:var(--ink);color:#fff}
.acts details>div{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-top:6px}
.seg{display:flex;background:var(--tile);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:5px 11px;font-size:12px;color:var(--soft);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.gobox{display:flex;flex-direction:column;align-items:center;gap:4px;margin-left:auto;min-width:130px}
.go{width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:11px 20px;font-size:13.5px;font-weight:500;letter-spacing:.06em}
.go:hover:not(:disabled){background:#000}
.go:disabled{background:var(--faint);cursor:not-allowed}
.cost{margin:0;font-size:11px;color:var(--soft);text-align:center;min-height:16px}
.msg{margin:10px 0 0;padding:8px 12px;border-radius:var(--r-sm);font-size:12.5px;color:var(--danger);background:#FBEDEA}
.msg:empty{display:none}
.lookwrap{position:relative}
.looks{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;scroll-snap-type:x proximity;scroll-behavior:smooth}
.looks::-webkit-scrollbar{display:none}
.lookwrap.l .looks{-webkit-mask-image:linear-gradient(90deg,transparent,#000 48px);mask-image:linear-gradient(90deg,transparent,#000 48px)}
.lookwrap.r .looks{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.lookwrap.l.r .looks{-webkit-mask-image:linear-gradient(90deg,transparent,#000 48px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,transparent,#000 48px,#000 calc(100% - 48px),transparent)}
.lookwrap .nav{position:absolute;z-index:5;top:50%;width:30px;height:30px;margin-top:-15px;border:0;border-radius:50%;background:rgba(255,255,255,.95);
  box-shadow:0 2px 8px rgba(0,0,0,.12);color:var(--ink);font-size:15px;line-height:30px;padding:0;opacity:0;pointer-events:none;transition:opacity .2s}
.lookwrap .nav.prev{left:-6px}.lookwrap .nav.next{right:-6px}
.lookcard:hover .lookwrap.l .nav.prev,.lookcard:hover .lookwrap.r .nav.next{opacity:1;pointer-events:auto}
.lookwrap .nav:hover{background:var(--ink);color:#fff}
.look{scroll-snap-align:start}
.look{position:relative;flex:0 0 96px}
.look button.v{display:block;width:100%;padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:var(--tile-hi)}
.look img{width:100%;height:100%;object-fit:cover;display:block}
.look.on button.v{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.look .x{top:-6px;right:-6px;width:18px;height:18px;line-height:18px;font-size:11px}

/* ---------- 镜子 ---------- */
.mirrorcol{min-width:0;display:flex}
.mirrorcol .stage{aspect-ratio:auto;height:100%;flex:1}
.stage{position:relative;aspect-ratio:3/4;width:100%;border-radius:var(--r-lg);overflow:hidden;background:#FFFFFF;perspective:1400px;touch-action:pan-y;user-select:none}
.model{position:absolute;inset:4% 5% 4%;transform-style:preserve-3d;transition:transform .8s var(--ease)}
.breathe{position:absolute;inset:0;animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.006)}}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .45s ease}
.frame.show{opacity:1}
/* 色卡：仿色卡样式，浮在照片左侧，不挤占人像的位置 */
.palette{position:absolute;left:4%;top:8%;width:11%;min-width:46px;max-width:68px;display:flex;flex-direction:column;gap:10px;z-index:2;pointer-events:none}
.pchip{background:#fff;box-shadow:0 2px 7px rgba(40,30,20,.10);display:block;opacity:0;transform:translateX(-6px);animation:pin .5s var(--ease) forwards}
.pchip .swatch{aspect-ratio:1.25/1}
.pchip .lb{padding:3px 5px 4px;font:500 7.5px/1.35 var(--sans);color:#3a3936;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.pchip .lb .en{color:var(--soft)}
@keyframes pin{to{opacity:1;transform:none}}
.frame.vid{transition:opacity .35s ease}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--soft);padding:32px}
.empty b{font:400 30px/1.2 var(--serif);font-style:italic;color:var(--ink)}
.empty button{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:10px 20px;font-size:13px}
.badge{position:absolute;left:14px;top:14px;background:rgba(27,27,26,.72);color:#fff;backdrop-filter:blur(6px);border-radius:999px;padding:3px 11px;font-size:12px}
.acts{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.acts button{border:0;border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);padding:5px 12px;font-size:12px}
.acts button:hover{background:var(--ink);color:#fff}
.busy{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:999px;padding:9px 18px;font-size:13px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.busy i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.turnhint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:11.5px;color:var(--soft);pointer-events:none}

/* ---------- 弹层 ---------- */
.veil{position:fixed;inset:0;z-index:30;background:rgba(238,237,234,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border-radius:var(--r-lg);padding:24px;width:min(440px,100%);box-shadow:0 30px 60px rgba(0,0,0,.08)}
.sheet h3{margin:0 0 14px;font:400 20px/1.2 var(--serif);font-style:italic}
.previews{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.previews img{width:72px;height:90px;object-fit:cover;background:var(--tile);border-radius:var(--r-sm)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cats button{border:0;border-radius:999px;background:var(--tile);padding:6px 14px;font-size:13px;color:var(--soft)}
.cats button[aria-pressed="true"]{background:var(--ink);color:#fff}
.field{width:100%;border:0;border-bottom:1px solid var(--line);padding:9px 2px;font-size:14px;background:none;outline:0}
.field:focus{border-bottom-color:var(--ink)}
.opt{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px}
.opt input{margin-top:4px;accent-color:var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn{border:0;border-radius:999px;padding:9px 20px;font-size:13px;background:var(--tile);white-space:nowrap}
.btn.dark{background:var(--ink);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(420px,100%);background:var(--card);padding:24px;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.08);animation:slide .35s var(--ease)}
@keyframes slide{from{transform:translateX(100%)}}
/* 顶部的客户按钮：显示当前客户，点开客户档案 */
.who{border:0;background:var(--tile-hi);border-radius:999px;padding:5px 16px;font-size:12.5px;color:var(--ink);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who:hover{background:var(--ink);color:#fff}
.pgroup{margin-top:22px}
.pgroup h4{display:flex;align-items:baseline;gap:10px;margin:0;font:400 17px/1.3 var(--serif);font-style:italic}
.pgroup h4 .link{font:400 12px var(--sans);font-style:normal}
.pgroup h4.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);align-self:center}
.photo select{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--card);font:inherit;font-size:12px;padding:3px 6px;color:var(--soft)}
.drawer h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font:400 22px/1.2 var(--serif);font-style:italic}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.photo{position:relative}
.photo .pick{display:block;width:100%;aspect-ratio:3/4;border:0;padding:0;border-radius:var(--r);overflow:hidden;background:var(--tile)}
.photo .pick img{width:100%;height:100%;object-fit:cover;display:block}
.photo.on .pick{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.photo .tag{font-size:12px;color:var(--soft);margin-top:4px}
.photo .mk{width:100%;margin-top:6px;border:0;border-radius:999px;background:var(--tile);font-size:12px;padding:6px}
.photo .mk:hover:not(:disabled){background:var(--ink);color:#fff}
.photo .x{opacity:1;top:6px;right:6px}
.addp{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;border:1.5px dashed var(--faint);border-radius:var(--r);background:none;color:var(--soft);font-size:13px;width:100%}

@media (max-width:1100px){.bottom{grid-template-columns:1fr}}
@media (max-width:1000px){
  .mirrorcol .stage{aspect-ratio:3/4;height:auto}
  .shelfwrap{grid-template-columns:1fr}
  .shelflabel{padding:0 0 4px 4px}
  .top{padding:14px 16px 0}
  .room{grid-template-columns:1fr;padding:6px 16px 24px}
  .mirrorcol{width:100%;min-width:0;order:-1}
  .fit{grid-template-columns:1fr}
  .gobox{min-width:0}
  .rail{padding:0 16px;justify-content:flex-start}
  .x{opacity:1}
}
/* ---------- 纽扣光标：只在有鼠标的电脑上 ---------- */
html.btncur,html.btncur *{cursor:none!important}
html.btncur input:not([type=checkbox]):not([type=radio]),html.btncur textarea{cursor:text!important}
.cur{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;z-index:1000;opacity:0;transition:opacity .2s}
.cur.in{opacity:1}
.cur .b{width:100%;height:100%;display:block;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.cur.hover .b{transform:scale(1.35) rotate(45deg)}
.cur.press .b{transform:scale(.82)}
.cur.spin .b{animation:curspin .9s linear infinite}
@keyframes curspin{from{transform:scale(1.2) rotate(0)}to{transform:scale(1.2) rotate(360deg)}}
.cur .sew{opacity:0}
.cur.sewn .sew{animation:cursew .95s ease forwards}
.cur.sewn .b{animation:cursnap .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes cursew{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}

function pickModel(pid){
  const models=S.items.filter(i=>i.category==='model').sort((a,b)=>a.created-b.created);
  const close=()=>{$('layer').replaceChildren();renderDrawer()};
  const body=models.length?h('div',{class:'mpick'},...models.map(m=>h('button',{async onclick(){
      try{await api(`/api/profiles/${encodeURIComponent(pid)}/model`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model_id:m.id})});
        close();await refresh();const p=profiles().find(x=>x.id===pid);if(p&&p.photos.length){sel.person=p.photos[p.photos.length-1].id;viewing=null;keep();render()}}catch(e){alert(e.message)}}},
    h('img',{src:src(m),alt:''}),nameOf(m),gtag(m)))):h('p',{class:'muted'},'服装库里还没有模特。到“服装库 → 模特”上传一个。');
  $('layer').replaceChildren(h('div',{class:'veil',onclick:e=>{if(e.target===e.currentTarget)close()}},
    h('div',{class:'sheet',role:'dialog','aria-label':'选择模特'},h('h3',{},'给 TA 放一个模特'),body,
      h('div',{class:'row'},h('button',{class:'btn',onclick:close},'取消')))));
}

<body>
<header class="top">
  <div class="brand">D<i>-</i>Closet</div>
  <button class="who" id="who" title="打开客户档案库：切换客户、新建、查看和修改资料">选择客户 ▾</button>
  <span class="demo" id="demo" hidden>演示模式 · 还没填 key</span>
  <button class="link" id="open-clib">客户档案库</button>
  <button class="link" id="open-lib">服装库</button>
  <button class="link" id="open-settings">⚙ 设置</button>
</header>

<div class="nativewarn" id="nativewarn" hidden></div>

<div class="room">
  <section class="closet" aria-label="衣橱">
    <div class="rack">
      <div class="seg2 gf" id="gf" aria-label="按性别筛选衣橱"></div>
      <div class="rod"></div>
      <div class="rail" id="rail"></div>
      <div class="caption" id="caption" aria-live="polite"></div>
    </div>
    <div class="shelfwrap" id="shelfwrap" aria-label="鞋和配饰">
      <span class="shelflabel">鞋 · 配饰</span>
      <div class="shelf" id="shelf"></div>
      <div class="ledge"></div>
    </div>
    <div class="bottom">
    <section class="fit" aria-label="今天这一身">
      <h3>今天这一身</h3>
      <div class="pieces" id="pieces"></div>
      <div class="fitrow">
      <details class="wearbox"><summary id="wearsum">穿法与姿势</summary>
      <div class="wear" id="wear">
        <div class="seg shirtonly" data-k="tuck"><button data-v="in">塞进裤子</button><button data-v="out">放在外面</button></div>
        <div class="seg jacketonly" data-k="jw" title="西装外套敞开还是扣上"><button data-v="open">外套敞开</button><button data-v="buttoned">外套扣上</button></div>
        <div class="seg shirtonly sleevesonly" data-k="sleeves"><button data-v="down">袖子放下</button><button data-v="rolled">卷到手肘</button></div>
        <div class="seg shirtonly" data-k="collar"><button data-v="open">解开一粒</button><button data-v="closed">全部扣好</button></div>
        <div class="seg" data-k="pose" title="固定姿势，几套搭配放在一起更统一；转一圈视频推荐“双手微张”"><button data-v="down">双手自然下垂</button><button data-v="open">双手微张</button><button data-v="pocket">单手插兜</button></div>
      </div>
      </details>
      <div class="gobox"><button class="go" id="go">生成试穿</button><p class="cost" id="cost"></p></div>
      </div>
      <p class="msg" id="msg" role="alert"></p>
    </section>
    <section class="lookcard" aria-label="穿过的搭配">
      <h3>已试穿的搭配</h3>
      <div class="lookwrap" id="lookwrap"><button class="nav prev" aria-label="往前" id="lprev">‹</button><div class="looks" id="looks"></div><button class="nav next" aria-label="往后" id="lnext">›</button></div>
    </section>
    </div>
  </section>

  <section class="mirrorcol" aria-label="试穿">
    <div class="stage" id="stage"><div class="model" id="model"><div class="breathe" id="frames"></div></div></div>
  </section>
</div>

<input type="file" id="file" accept="image/*,.heic,.heif" multiple hidden>
<div id="lib" class="lib" hidden></div>
<div id="clib" class="lib" hidden></div>
<div id="layer"></div>
<div id="slayer"></div>
<div class="cur" id="cur" aria-hidden="true"><svg class="b" viewBox="0 0 22 22">
  <defs><radialGradient id="pearl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#F1ECE4"/><stop offset="1" stop-color="#D9D1C4"/></radialGradient></defs>
  <circle cx="11" cy="11" r="10" fill="url(#pearl)" stroke="#B9B0A2" stroke-width=".8"/>
  <circle cx="11" cy="11" r="7.2" fill="none" stroke="#CFC6B8" stroke-width=".7"/>
  <g fill="#A79C8C"><circle cx="8.6" cy="8.6" r="1.25"/><circle cx="13.4" cy="8.6" r="1.25"/><circle cx="8.6" cy="13.4" r="1.25"/><circle cx="13.4" cy="13.4" r="1.25"/></g>
  <g class="sew" stroke="#C9895B" stroke-width="1.1" stroke-linecap="round"><path d="M8.6 8.6 13.4 13.4M13.4 8.6 8.6 13.4"/></g>
</svg></div>

<script>
const LABEL={person:'客户照片',shirt:'衬衫',polo:'POLO衫',jacket:'西装外套',pants:'裤子',belt:'腰带',shoes:'鞋子',hat:'帽子',accessory:'配饰'};
/* 木衣架：金属挂钩 + 木头肩；裤架：直杆 + 两个夹子 */
const HANGER=`<svg class="hook" viewBox="0 0 100 40"><path d="M50 19c0-4 5-4.5 5-9.5a5 5 0 0 0-10 0" fill="none" stroke="#9d9d9d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M50 17 6 33c-3 1-3 5 1 5h86c4 0 4-4 1-5z" fill="url(#w)"/><defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8714C"/><stop offset="1" stop-color="#7A4E33"/></linearGradient></defs></svg>`;
const PANTS_HOOK=`<svg class="hook" viewBox="0 0 100 40"><path d="M50 19c0-4 5-4.5 5-9.5a5 5 0 0 0-10 0" fill="none" stroke="#9d9d9d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M50 17v8" stroke="#9d9d9d" stroke-width="2.2"/><rect x="10" y="24" width="80" height="6" rx="3" fill="#8A5A3B"/></svg>`;
const S_HOOK=`<svg class="hook" viewBox="0 0 100 40"><path d="M50 19c0-4 5-4.5 5-9.5a5 5 0 0 0-10 0M50 19c0 5-6 6-6 11a6 6 0 0 0 12 0" fill="none" stroke="#9d9d9d" stroke-width="2.2" stroke-linecap="round"/></svg>`;
/* 自带衣架（整理过的）只配一个短挂钩，和原来裤架的钩子一样；钩柄刚好插进衣架顶端，不从下面露出来 */
const HOOK_ONLY=`<svg class="hook" viewBox="0 0 20 29"><path d="M10 29V17c0-4 5-4.5 5-9.5a5 5 0 0 0-10 0" fill="none" stroke="#9d9d9d" stroke-width="2.2" stroke-linecap="round"/></svg>`;
const CLIPS=`<svg class="clips" viewBox="0 0 100 40"><rect x="18" y="26" width="9" height="11" rx="2" fill="#a9a9a9"/><rect x="73" y="26" width="9" height="11" rx="2" fill="#a9a9a9"/></svg>`;
const $=id=>document.getElementById(id);
function h(tag,attrs={},...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k==='style')e.setAttribute('style',v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}
  for(const k of kids.flat())if(k!=null)e.append(k);return e}
const hoverable=matchMedia('(hover:hover)').matches;

let S={items:[],looks:[],config:{}};
let beltNote=false, job=null, viewing=null, peek=false, est=null, estKey='', estTimer=null, portraiting=null, hovered=null;
const GARMENT_CATS=['shirt','polo','jacket','pants','belt','shoes','hat','accessory','model'];
const TOPS=['shirt','polo','jacket'], RAILCATS=['jacket','shirt','polo','pants'], SHELF=['shoes','belt','hat','accessory'];
const GLABEL={man:'男款',woman:'女款',unisex:'通用'};
const slotOf=i=>i.category==='polo'?'shirt':i.category;   /* POLO衫和衬衫占同一个“上衣”位 */
const blank={person:null,shirt:null,jacket:null,pants:null,belt:null,shoes:null,hat:null,accessories:[],tuck:'in',sleeves:'down',collar:'open',jw:'open',pose:'down'};
let sel={...blank};
try{sel={...blank,...JSON.parse(localStorage.getItem('sel')||'{}')}}catch(e){}
const keep=()=>{try{localStorage.setItem('sel',JSON.stringify(sel))}catch(e){}};

async function api(path,opts={}){
  let r;
  try{r=await fetch(path,opts)}catch(e){throw new Error('连不上本地服务。确认终端里的 python app.py 还在运行。')}
  if(!r.ok){let d='';try{d=(await r.json()).detail}catch(e){} throw new Error(d||`请求失败（${r.status}）`)}
  return r.json();
}
const item=id=>S.items.find(i=>i.id===id);
const src=i=>`/media/items/${i.file}`;
const cut=i=>i.cut?`/media/items/${i.cut}`:src(i);
const of=c=>S.items.filter(i=>i.category===c).sort(byOrder);
const nameOf=i=>i.name||LABEL[i.category];
function say(t){$('msg').textContent=t||''}

async function refresh(){
  S=await api('/api/state');
  for(const k of['person','shirt','jacket','pants','belt','shoes','hat'])if(sel[k]&&!item(sel[k]))sel[k]=null;
  sel.accessories=sel.accessories.filter(item);
  if(!sel.person){const p=of('person')[0];if(p)sel.person=p.id}
  if(viewing)viewing=S.looks.find(l=>l.id===viewing.id)||null;
  keep();render();
}
function render(){$('demo').hidden=!S.config.demo;{const w=$('nativewarn');w.hidden=!S.config.native_error;w.textContent=S.config.native_error?'没能打开独立窗口，已改用浏览器：'+S.config.native_error:''}renderWho();renderGf();renderLibrary();renderCustLib();renderRail();renderShelf();renderFit();renderLooks();renderStage();renderDrawer();fitPage()}
/* 整个界面放在一屏里：电脑上窗口不够高时，把衣杆整体缩小到刚好放下，不用往下滚 */
function fitPage(){
  const r=document.querySelector('.rack'), de=document.documentElement;
  if(innerWidth<=1000){r.style.removeProperty('--rz');return}
  r.style.setProperty('--rz',1);
  const over=de.scrollHeight-innerHeight;
  if(over>0){const hgt=r.offsetHeight;r.style.setProperty('--rz',Math.max(.55,(hgt-over-2)/hgt).toFixed(3))}
}
addEventListener('resize',fitPage);

/* ---------- 衣杆：平时侧挂，划过的那件转成正面 ---------- */
const isOn=i=>i.category==='accessory'?sel.accessories.includes(i.id):sel[slotOf(i)]===i.id;
function wearIt(i){
  if(job)return;
  curRing();
  if(i.category==='accessory'){
    const a=sel.accessories;
    if(a.includes(i.id))sel.accessories=a.filter(x=>x!==i.id);
    else if(a.length>=S.config.max_accessories){say(`配饰一次最多 ${S.config.max_accessories} 件。`);return}
    else a.push(i.id);
  }else sel[slotOf(i)]=sel[slotOf(i)]===i.id?null:i.id;
  if(i.category==='belt'&&sel.belt&&sel.tuck==='out'){sel.tuck='in';beltNote=true}
  viewing=null;say('');keep();render();
}
/* 按顺序排：拖过的按拖好的顺序；新挂上的排在最前面 */
const byOrder=(a,b)=>(a.order??-1e9)-(b.order??-1e9)||b.created-a.created;
/* ---------- 男款 / 女款：衣橱按性别筛。默认跟着当前客户的性别走；通用款和老单品（没标过性别）两边都显示 ---------- */
let gf='all', gfAuto=true;

      v.addEventListener('timeupdate',()=>{if(!dragging&&!v.paused&&v.currentTime>=turnEnd(v))endTurn()});
      v.addEventListener('loadedmetadata',alignVideo);
      $('frames').append(v);
      let boxReady;const ready=new Promise(ok=>boxReady=ok);
      /* 视频背景常常比刷成纯白的照片略灰，交接时像闪一下：把视频整体提亮一点点，背景接近纯白（最多提亮 7%） */
      const setBox=r=>{const b=r&&r.box, bg=r&&r.bg;v._box=b;if(bg&&bg<252)v.style.filter=`brightness(${Math.min(1.07,253/bg).toFixed(3)})`;alignVideo();boxReady()};
      if(!turnEnds[u]){const t={};t.box=new Promise(ok=>{t.run=analyzeTurn(u,ok).catch(()=>{ok(null);return null})});turnEnds[u]=t}
      turnEnds[u].box.then(setBox);
      turnEnds[u].run.then(r=>{if(r)v._end=r.end});
      if(playOnce===viewing.id){playOnce=null;  /* 先对齐好再开始转，第一帧和照片完全重合 */
        Promise.all([ready,new Promise(ok=>v.readyState>=2?ok():v.addEventListener('loadeddata',ok,{once:true}))]).then(()=>playTurn())}
    }
  }else if(playOnce&&viewing&&playOnce===viewing.id&&vid()){playOnce=null;playTurn()}
  if(!list.length){
    st.append(h('div',{class:'empty'},h('b',{},'Hello.'),'先在“客户档案库”选一位客户，再从衣杆上挑衣服。',
      h('button',{onclick:openCustLib},'打开客户档案库')));
  }else if(peek||!viewing)st.append(h('span',{class:'badge'},'原照'));
  else if(viewing.demo)st.append(h('span',{class:'badge'},'演示图'));
  if(viewing&&!job){
    const acts=h('div',{class:'acts'});
    const b=h('button',{'aria-pressed':String(peek)},peek?'松开回到搭配':'按住看原照');
    const off=()=>{removeEventListener('pointerup',off);removeEventListener('pointercancel',off);removeEventListener('blur',off);
      if(peek){peek=false;renderStage()}};
    b.addEventListener('pointerdown',e=>{e.preventDefault();peek=true;renderStage();
      addEventListener('pointerup',off);addEventListener('pointercancel',off);addEventListener('blur',off)});
    b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!peek){e.preventDefault();peek=true;renderStage();addEventListener('keyup',function u(){removeEventListener('keyup',u);off()})}});
    acts.append(b);
    acts.append(viewing.video?h('button',{onclick:()=>playTurn()},'转一圈'):
      h('button',{title:'生成一段原地转身一周的视频'+(S.config.turn_cost?`，约 ¥${S.config.turn_cost.toFixed(2)}`:''),onclick:makeTurn},'转一圈'));
    acts.append(h('button',{onclick:()=>generate(true)},'重新生成'));
    const more=[];
    if(viewing.video)more.push(h('button',{title:'不满意，重新生成一段转身视频'+(S.config.turn_cost?`，约 ¥${S.config.turn_cost.toFixed(2)}`:''),onclick:()=>makeTurn(true)},'重转一次'));
    if(!viewing.demo)more.push(h('button',{title:'哪里不对就只修哪里',onclick:fixSheet},'修一下'));
    if(viewing.history&&viewing.history.length)more.push(h('button',{onclick:undoFix},'撤销修改'));
    if(more.length)acts.append(h('details',{},h('summary',{},'更多'),h('div',{},...more)));
    st.append(acts);
  }
  st.toggleAttribute('data-turn',!!hasVid);   /* 有转身视频：人物可以点 */
  if(hasVid)st.append(h('div',{class:'turnhint'},hoverable?'点一下人物转一圈 · 左右拖动看转身':'点一下人物转一圈 · 左右滑动看转身'));
  if(job)st.append(h('div',{class:'busy'},h('i'),(job.step||'生成中')+` · ${Math.round((Date.now()-jobStart)/1000)} 秒`));
}

/* ---------- 形象：同一个人的照片（原照 + 形象照）算一个形象；衣橱共用，Looks 按形象分开 ---------- */
function profileOf(it){
  const seen=new Set();
  while(it&&!seen.has(it.id)){seen.add(it.id);
    if(it.profile)return it.profile;
    if(!it.from)return it.id;
    const p=item(it.from);if(!p)return it.from;it=p}
  return it?it.id:null;
}
const lookPid=l=>{const p=item((l.sel||{}).person_id);return p?profileOf(p):(l.profile||(l.sel||{}).person_id)};
function profiles(){   /* 有照片的形象按最早那张照片排；照片删光了但还有搭配的形象排在后面 */
  const out=[], seen={};
  [...of('person')].sort((a,b)=>a.created-b.created).forEach(i=>{const pid=profileOf(i);if(!seen[pid])out.push(seen[pid]={id:pid,photos:[]});seen[pid].photos.push(i)});
  S.looks.forEach(l=>{const pid=lookPid(l);if(pid&&!seen[pid])out.push(seen[pid]={id:pid,photos:[]})});
  Object.keys(S.profiles||{}).forEach(pid=>{if(!seen[pid])out.push(seen[pid]={id:pid,photos:[]})});   /* 只建了档案、还没放照片的客户 */
  out.forEach((p,n)=>{p.rec=(S.profiles||{})[p.id]||{};p.name=p.rec.name||`客户 ${n+1}`});
  return out;
}
let curPid=null;try{curPid=localStorage.getItem('pid')}catch(e){}
function activePid(){   /* 当前形象：正在用的照片属于谁；没有照片的形象（照片删光了）靠记下来的 curPid */
  const p=item(sel.person);if(p)return profileOf(p);
  const all=profiles();
  if(curPid&&all.some(x=>x.id===curPid))return curPid;
  if(viewing)return lookPid(viewing);
  return all.length?all[0].id:null;
}

    else if(f.type==='toggle'){input=h('input',{type:'checkbox',class:'tg',onchange:e=>{setEdits[f.key]=e.target.checked?'1':'0';setClear.delete(f.key);renderSettingsKeep()}});input.checked=(edited?setEdits[f.key]:f.value)==='1'}

        value:edited?setEdits[f.key]:(f.source==='default'?'':f.value),oninput:e=>{setEdits[f.key]=e.target.value;setClear.delete(f.key);renderSettingsKeep()}})}
    const reset=(f.source==='db'&&!cleared)?h('button',{class:'link',type:'button',onclick:()=>{setClear.add(f.key);delete setEdits[f.key];renderSettings()}},f.type==='secret'?'清除':'恢复默认'):null;

      f.help?h('span',{class:'muted'},f.help):null,reset);

  const save=h('button',{class:'btn dark',disabled:!changed,async onclick(){
    save.disabled=true;save.textContent='保存中…';

async function tidyIt(i){
  if(libBusy)return;
  const cost=S.config.tidy_cost?`，约 ¥${S.config.tidy_cost.toFixed(2)}`:'';
  if(!confirm(`用 AI 把“${nameOf(i)}”整理成干净的白底单品图${cost}？原图会保留，不满意可以还原。`))return;
  libBusy=i.id;say('');renderLibrary();
  try{await api(`/api/items/${i.id}/tidy`,{method:'POST'});railKey=''}catch(e){alert(e.message)}
  finally{libBusy=null;await refresh()}
}
async function untidyIt(i){
  if(libBusy)return;
  try{await api(`/api/items/${i.id}/untidy`,{method:'POST'});railKey='';await refresh()}catch(e){alert(e.message)}
}
function renderLibrary(){
  const box=$('lib');
  if(!libOpen){box.hidden=true;box.replaceChildren();document.body.classList.remove('nolock');return}
  if(libDrag)return;
  box.hidden=false;
  const keepTop=box.scrollTop;
  const inG=i=>libG==='all'||!i.gender||i.gender==='unisex'||i.gender===libG;
  const all=S.items.filter(i=>LIBCATS.includes(i.category)&&inG(i));
  const list=all.filter(i=>!libCat||i.category===libCat).sort((a,b)=>i2(a)-i2(b)||byOrder(a,b));
  function i2(i){return libCat?0:LIBCATS.indexOf(i.category)}
  const chip=(k,t,n)=>h('button',{'aria-pressed':String(libCat===k),onclick:()=>{libCat=k;renderLibrary()}},`${t} ${n}`);
  const card=i=>{
    const garment=i.category!=='model', busy=libBusy===i.id;
    const el=h('div',{class:'lcard'+(busy?' busy':''),'data-id':i.id,draggable:libCat?'true':'false'},
      h('div',{class:'lph'+(i.category==='model'?' model':'')},h('img',{src:i.category==='model'?src(i):cut(i),alt:nameOf(i),draggable:'false',loading:'lazy'}),
        busy?h('span',{class:'lbusy'},'整理中…'):null),
      h('div',{class:'lname'},h('b',{},nameOf(i)),gtag(i),i.builtin?h('span',{class:'gt'},'默认'):null,
        !libCat?h('span',{class:'gt'},LABEL[i.category]):null,i.orig?h('span',{class:'gt ok'},'已整理'):null),
      h('div',{class:'lact'},h('button',{class:'link',onclick:()=>renameSheet(i)},'改名 / 款式'),
        garment&&!i.orig?h('button',{class:'link',disabled:!!libBusy,title:'AI 整理成白底单品图，衣杆上更好看、换装更准',onclick:()=>tidyIt(i)},'整理成单品图'):null,
        i.orig?h('button',{class:'link',disabled:!!libBusy,onclick:()=>untidyIt(i)},'还原原图'):null,
        h('button',{class:'link del',disabled:!!libBusy,onclick:()=>remove(i)},'删除')));
    if(libCat){   /* 选了一个品类才能拖动排序：衣杆上就按这个顺序挂 */
      el.addEventListener('dragstart',e=>{libDrag=true;el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',i.id)});
      el.addEventListener('dragend',async()=>{
        el.classList.remove('dragging');libDrag=false;
        const ids=[...box.querySelectorAll('.lcard[data-id]')].map(x=>x.dataset.id);
        ids.forEach((id,n)=>{const it=item(id);if(it)it.order=n});railKey='';
        try{await api('/api/items/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})})}catch(er){alert(er.message)}
        render();
      });
      el.addEventListener('dragover',e=>{e.preventDefault();const d=box.querySelector('.lcard.dragging');if(!d||d===el)return;
        const r=el.getBoundingClientRect(), after=e.clientX>r.left+r.width/2;after?el.after(d):el.before(d)});
    }
    return el;
  };
  const upCatNow=libCat||'shirt';
  const gseg=h('div',{class:'seg2'},...[['all','全部'],['man','男款'],['woman','女款']].map(([k,t])=>h('button',{type:'button','aria-pressed':String(libG===k),onclick:()=>{libG=k;renderLibrary()}},t)));
  const view=h('div',{class:'libin'},
    h('div',{class:'libhead'},h('button',{class:'link',onclick:closeLibrary},'‹ 返回衣橱'),h('h2',{},'服装库'),
      h('span',{class:'muted'},'上传、整理、改名、排序都在这里；衣橱页面只负责挑衣服试穿'),
      h('span',{class:'sp'}),gseg,
      h('button',{class:'btn dark',onclick:()=>pickFiles(upCatNow)},'+ 上传'+(libCat?LABEL[libCat]:'服装'))),
    h('div',{class:'cats libcats'},chip('','全部',all.length),...LIBCATS.map(c=>chip(c,LABEL[c],all.filter(i=>i.category===c).length))),
    libCat?h('p',{class:'muted',style:'margin:0 0 10px'},'按住卡片左右拖动可以排顺序，衣杆上就按这个顺序挂。'):null,
    list.length?h('div',{class:'lgrid'},...list.map(card))
      :h('div',{class:'lempty'},all.length?'这一类里没有符合条件的。':'服装库还是空的。点右上角“+ 上传”，一次可以选好几张。',
        libCat==='model'?h('p',{class:'muted'},'这里放默认模特：新客户建档时按性别自动配一个。想用写实模特，上传你有授权的模特全身照（正面站立、白底最好）。'):null));
  box.replaceChildren(view);box.scrollTop=keepTop;
}
$('open-lib').addEventListener('click',()=>openLibrary());
$('open-clib').addEventListener('click',openCustLib);

refresh().catch(e=>say(e.message));

/* ---------- 纽扣光标：一颗四眼衬衫扣，轻轻跟着鼠标；划过能点的东西转一下，生成时旋转，好了“扣上” ---------- */
const CUR=$('cur'), curOn=matchMedia('(hover:hover) and (pointer:fine)').matches;
let curX=0,curY=0,curTX=0,curTY=0;
function curRing(){if(!curOn)return;const r=h('div',{class:'curring',style:`left:${curX}px;top:${curY}px`});document.body.append(r);setTimeout(()=>r.remove(),750)}
function curBusy(on,ok){
  if(!curOn)return;
  CUR.classList.toggle('spin',on);
  if(on){CUR.classList.remove('hover','sewn');return}
  if(ok){void CUR.offsetWidth;CUR.classList.add('sewn');curRing();setTimeout(()=>CUR.classList.remove('sewn'),1000)}
}
if(curOn){
  document.documentElement.classList.add('btncur');
  const slow=!matchMedia('(prefers-reduced-motion:reduce)').matches;
  const clickable='button:not(:disabled),a[href],label,select,summary,[role=button],input[type=checkbox],input[type=radio],.stage[data-turn] .model';
  addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse')return;
    curTX=e.clientX;curTY=e.clientY;
    if(!CUR.classList.contains('in')){curX=curTX;curY=curTY;CUR.classList.add('in')}
    const t=e.target instanceof Element?e.target:null;
    CUR.style.visibility=t&&t.closest('input:not([type=checkbox]):not([type=radio]),textarea')?'hidden':'';   /* 打字的地方用系统的文字光标 */
    CUR.classList.toggle('hover',!!(t&&t.closest(clickable))&&!CUR.classList.contains('spin'));
  },{passive:true});
  document.documentElement.addEventListener('mouseleave',()=>CUR.classList.remove('in'));
  addEventListener('blur',()=>CUR.classList.remove('in'));
  addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')CUR.classList.add('press')});
  addEventListener('pointerup',()=>CUR.classList.remove('press'));
  (function curLoop(){  /* 有一点点滞后，像挂在线上 */
    const k=slow?.3:1;curX+=(curTX-curX)*k;curY+=(curTY-curY)*k;
    CUR.style.transform=`translate(${curX.toFixed(1)}px,${curY.toFixed(1)}px)`;requestAnimationFrame(curLoop);
  })();
}
</script>
