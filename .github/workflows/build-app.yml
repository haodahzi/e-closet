name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/new-work"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-desktop.txt
      - name: Syntax check (CI Python 3.11)
        run: python -m compileall -q desktop.py dcloset_app.py providers.py db.py settings.py palette.py build_app.py
      - run: python build_app.py
      - name: Diagnostics - what PyInstaller bundled
        if: always()
        shell: python
        run: |
          import glob
          for f in glob.glob("build/SENDI/warn-SENDI.txt"):
              print("== warnings mentioning our modules ==")
              for l in open(f, encoding="utf-8", errors="replace"):
                  if any(k in l for k in ("named app", "named dcloset_app", "named db ", "named providers", "named settings", "named palette")):
                      print(l.rstrip())
          for f in glob.glob("build/SENDI/PYZ-00.toc"):
              t = open(f, encoding="utf-8", errors="replace").read()
              print("== PYZ has dcloset_app:", "'dcloset_app'" in t, "| fastapi:", "'fastapi'" in t, "| providers:", "'providers'" in t)
      - name: Smoke test - start the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DCLOSET_NO_WINDOW = "1"; $env:NO_BROWSER_FALLBACK = "1"; $env:PORT = "8150"
          $env:DCLOSET_HOME = "$PWD\smoke_home"
          $p = Start-Process -FilePath "dist\SENDI\SENDI.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 1
            try { Invoke-WebRequest http://127.0.0.1:8150/api/state -UseBasicParsing -TimeoutSec 2 | Out-Null; $ok = $true; break } catch {}
            if ($p.HasExited) { break }
          }
          if (Test-Path smoke_home\app.log) { Get-Content smoke_home\app.log }
          if (-not $ok) { throw "packaged app did not start" }
          Stop-Process -Id $p.Id -Force
      - name: Smoke test - start the packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          export DCLOSET_NO_WINDOW=1 NO_BROWSER_FALLBACK=1 PORT=8150 DCLOSET_HOME="$PWD/smoke_home"
          dist/SENDI.app/Contents/MacOS/SENDI > smoke.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            sleep 1
            if curl -fs http://127.0.0.1:8150/api/state > /dev/null; then ok=1; break; fi
            kill -0 $PID 2>/dev/null || break
          done
          cat smoke.log; cat smoke_home/app.log 2>/dev/null || true
          [ $ok = 1 ] || { echo "packaged app did not start"; exit 1; }
          kill $PID
      - name: Self-test - native window components (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:DCLOSET_SELFTEST_WEBVIEW = "1"; $env:DCLOSET_HOME = "$PWD\wv_home"
          Start-Process -FilePath "dist\SENDI\SENDI.exe" -Wait
          if (Test-Path wv_home\app.log) { Get-Content wv_home\app.log }
      - name: Self-test - native window components (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          DCLOSET_SELFTEST_WEBVIEW=1 DCLOSET_HOME="$PWD/wv_home" dist/SENDI.app/Contents/MacOS/SENDI 2>&1 || true
          cat wv_home/app.log 2>/dev/null || true
      - name: Self-test - standalone app window via Edge/Chrome (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:DCLOSET_NO_WINDOW = "1"; $env:NO_BROWSER_FALLBACK = "1"; $env:PORT = "8151"; $env:DCLOSET_HOME = "$PWD\aw_home"
          $p = Start-Process -FilePath "dist\SENDI\SENDI.exe" -PassThru
          Start-Sleep 20
          $win = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*--app=http://127.0.0.1:8151*" }
          if (Test-Path aw_home\app.log) { Get-Content aw_home\app.log }
          Get-ChildItem aw_home -ErrorAction SilentlyContinue | Out-String | Write-Host
          if ($win) { Write-Host "APP WINDOW OK: $($win[0].Name) started with --app=..." } else { Write-Host "APP WINDOW MISSING"; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw "no --app browser process" }
          Get-Process msedge, chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Self-test - standalone app window via Edge/Chrome (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          export DCLOSET_NO_WINDOW=1 NO_BROWSER_FALLBACK=1 PORT=8151 DCLOSET_HOME="$PWD/aw_home"
          dist/SENDI.app/Contents/MacOS/SENDI > aw.log 2>&1 &
          PID=$!
          sleep 20
          cat aw.log aw_home/app.log 2>/dev/null || true
          if pgrep -fl -- "--app=http://127.0.0.1:8151"; then echo "APP WINDOW OK"; else echo "APP WINDOW MISSING"; kill $PID 2>/dev/null; exit 1; fi
          pkill -f -- "--app=http://127.0.0.1:8151" || true
          kill $PID 2>/dev/null || true
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent SENDI.app SENDI-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SENDI-${{ runner.os }}
          path: |
            dist/SENDI
            dist/SENDI-mac.zip
