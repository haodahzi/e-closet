name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/new-work"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-desktop.txt
      - name: Syntax check (CI Python 3.11)
        run: python -m compileall -q desktop.py dcloset_app.py providers.py db.py settings.py palette.py build_app.py
      - run: python build_app.py
      - name: Diagnostics - what PyInstaller bundled
        if: always()
        shell: python
        run: |
          import glob
          for f in glob.glob("build/D-Closet/warn-D-Closet.txt"):
              print("== warnings mentioning our modules ==")
              for l in open(f, encoding="utf-8", errors="replace"):
                  if any(k in l for k in ("named app", "named dcloset_app", "named db ", "named providers", "named settings", "named palette")):
                      print(l.rstrip())
          for f in glob.glob("build/D-Closet/PYZ-00.toc"):
              t = open(f, encoding="utf-8", errors="replace").read()
              print("== PYZ has dcloset_app:", "'dcloset_app'" in t, "| fastapi:", "'fastapi'" in t, "| providers:", "'providers'" in t)
      - name: Smoke test - start the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DCLOSET_NO_WINDOW = "1"; $env:NO_BROWSER_FALLBACK = "1"; $env:PORT = "8150"
          $env:DCLOSET_HOME = "$PWD\smoke_home"
          $p = Start-Process -FilePath "dist\D-Closet\D-Closet.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep 1
            try { Invoke-WebRequest http://127.0.0.1:8150/api/state -UseBasicParsing -TimeoutSec 2 | Out-Null; $ok = $true; break } catch {}
            if ($p.HasExited) { break }
          }
          if (Test-Path smoke_home\app.log) { Get-Content smoke_home\app.log }
          if (-not $ok) { throw "packaged app did not start" }
          Stop-Process -Id $p.Id -Force
      - name: Smoke test - start the packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          export DCLOSET_NO_WINDOW=1 NO_BROWSER_FALLBACK=1 PORT=8150 DCLOSET_HOME="$PWD/smoke_home"
          dist/D-Closet.app/Contents/MacOS/D-Closet > smoke.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            sleep 1
            if curl -fs http://127.0.0.1:8150/api/state > /dev/null; then ok=1; break; fi
            kill -0 $PID 2>/dev/null || break
          done
          cat smoke.log; cat smoke_home/app.log 2>/dev/null || true
          [ $ok = 1 ] || { echo "packaged app did not start"; exit 1; }
          kill $PID
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent D-Closet.app D-Closet-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: D-Closet-${{ runner.os }}
          path: |
            dist/D-Closet
            dist/D-Closet-mac.zip
